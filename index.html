<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="方塊學習島">
<meta name="theme-color" content="#5fb0ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>方塊學習島</title>
<style>
:root{--b:clamp(30px,4.6vw,58px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;background:#7ec8ff;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
input{user-select:text;-webkit-user-select:text}
#app{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.sky{background:linear-gradient(#5fb0ff,#b6e0ff)}
.sky.sunset{background:linear-gradient(#ff8a4c,#ffb98a 55%,#ffe0b8)}
.night{background:linear-gradient(#0b1640,#28306b 70%,#3c3f86)}
.px{image-rendering:pixelated}
.blk{display:inline-block;background-size:100% 100%;image-rendering:pixelated;position:relative}
.tiled{background-size:var(--tile,64px) var(--tile,64px);image-rendering:pixelated}
.b{width:var(--b);height:var(--b);box-shadow:inset 0 0 0 2px rgba(0,0,0,.22)}
.b>b,.nb>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.48);
  color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:pop .3s both}
.s{width:calc(var(--b)*.42);height:calc(var(--b)*.42)}

.btn{font:inherit;font-weight:900;color:#fff;border:0;cursor:pointer;background:#8b8b8b;padding:.45em .9em;
  text-shadow:2px 2px 0 rgba(0,0,0,.5);font-size:clamp(16px,2.2vw,24px);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.3),0 0 0 3px #1e1e1e}
.btn:active{transform:translateY(2px);filter:brightness(.9)}
.btn.green{background:#4caf50}.btn.blue{background:#3d7bd9}.btn.orange{background:#e8892b}
.btn.small{padding:.2em .6em}.btn.big{font-size:clamp(22px,3.2vw,34px)}

/* 登入 */
.login{align-items:center;justify-content:center;gap:2vh}
.title{font-size:clamp(36px,7vw,80px);font-weight:900;text-shadow:5px 5px 0 #2f4f2f;letter-spacing:.06em;z-index:1}
.title.sm{font-size:clamp(32px,5vw,56px)}
.sub{font-size:clamp(18px,2.6vw,28px);font-weight:900;text-shadow:2px 2px 0 #335;z-index:1}
.kids{display:flex;gap:5vw;z-index:1;margin-bottom:14vh}
.kid{background:rgba(0,0,0,.28);border:0;padding:18px 22px 14px;color:#fff;font:inherit;font-weight:900;position:relative;cursor:pointer;
  box-shadow:0 0 0 4px #1e1e1e,inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.2);animation:bob 3s ease-in-out infinite}
.kid:nth-child(2){animation-delay:-1.5s}
.kid .face{width:clamp(110px,16vw,180px);height:clamp(110px,16vw,180px);display:block;box-shadow:0 0 0 4px #1e1e1e}
.kname{font-size:clamp(20px,3vw,32px);margin-top:10px;text-shadow:2px 2px 0 #000}
.kmeta{font-size:18px;opacity:.9}
.kid.sleep .face{filter:grayscale(.6) brightness(.6)}
.zzz{position:absolute;top:8px;right:12px;font-size:34px;font-weight:900;color:#cfe3ff;text-shadow:2px 2px 0 #000;animation:float 2s ease-in-out infinite}
.ground{position:absolute;left:0;right:0;bottom:0;height:16vh;--tile:64px}
.grassrow{height:64px}.dirtrow{position:absolute;top:64px;bottom:0;left:0;right:0}
.gear{position:absolute;right:16px;bottom:16px;z-index:2;font-size:18px}
.cloud{position:absolute;left:-220px;width:180px;height:44px;background:#fff;opacity:.9;animation:drift linear infinite}
.cloud::after{content:"";position:absolute;left:36px;top:-26px;width:90px;height:26px;background:#fff}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(0,0,0,.35);font-weight:900;font-size:clamp(16px,2.2vw,24px);flex:none}
.hface{width:44px;height:44px;box-shadow:0 0 0 3px #1e1e1e}
.hname{text-shadow:2px 2px 0 #000;white-space:nowrap}
.daybar{flex:1;height:18px;background:#1d2b4a;position:relative;box-shadow:0 0 0 3px #1e1e1e;margin:0 18px}
.dayfill{height:100%;background:linear-gradient(90deg,#ffd166,#ffe9a8);transition:width 1s linear}
.daybar.late .dayfill{background:linear-gradient(90deg,#ff6b2a,#ffae5c)}
.sunico{position:absolute;top:-9px;width:30px;height:30px;transition:left 1s linear}
.pill{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);padding:4px 8px;box-shadow:0 0 0 2px #1e1e1e;text-shadow:2px 2px 0 #000}
.ico{width:24px;height:24px}
.pulse{animation:pop .4s}
.banner{position:absolute;top:78px;left:50%;transform:translateX(-50%);background:#e8692b;padding:8px 22px;font-weight:900;
  font-size:clamp(18px,2.4vw,26px);box-shadow:0 0 0 3px #1e1e1e;z-index:6;white-space:nowrap;text-shadow:2px 2px 0 #000;animation:pop .4s}

/* 地圖 */
.mapgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;padding:18px 24px 8px;min-height:0}
.biome{position:relative;border:0;font:inherit;color:#fff;cursor:pointer;--tile:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;
  box-shadow:0 0 0 4px #1e1e1e,inset 0 -10px 0 rgba(0,0,0,.25)}
.biome:active{transform:translateY(3px)}
.biome .sym{font-size:clamp(40px,7vw,84px);font-weight:900;text-shadow:5px 5px 0 rgba(0,0,0,.55);line-height:1}
.bname{font-size:clamp(20px,3vw,32px);font-weight:900;background:rgba(0,0,0,.45);padding:2px 14px;text-shadow:2px 2px 0 #000}
.lv{font-size:clamp(14px,1.8vw,18px);font-weight:900;background:rgba(0,0,0,.4);padding:2px 10px}
.biome.locked .sym{opacity:.55}
.biome.locked::after{content:"🔒 即將開放";position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);padding:4px 10px;font-size:16px;font-weight:900}
.mapbar{display:flex;gap:16px;justify-content:center;padding:8px 0 16px;flex:none}

/* 遊戲 */
.gtop{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 6px;flex:none}
.pips{display:flex;gap:8px}
.pip{width:34px;height:34px;background:rgba(0,0,0,.3);box-shadow:0 0 0 3px #1e1e1e}
.pip.cur{outline:3px solid #ffd83a;outline-offset:3px}
.hintbtn{display:flex;align-items:center;gap:6px;background:#e8a72b}
.qcard{margin:4px auto 0;display:flex;align-items:center;gap:18px;background:rgba(0,0,0,.35);padding:8px 28px;box-shadow:0 0 0 4px #1e1e1e;flex:none}
.qtext{font-size:clamp(34px,6vw,72px);font-weight:900;text-shadow:4px 4px 0 #000;letter-spacing:.04em}
.visual{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0;overflow:hidden}
.answers{display:flex;justify-content:center;gap:clamp(12px,3vw,36px);padding:0 16px 3vh;flex:none}
.ans{min-width:clamp(90px,15vw,170px);font-size:clamp(34px,5.5vw,64px);padding:.2em .4em;background:#3d7bd9}
.ans.off{opacity:.3;filter:grayscale(1);pointer-events:none}
.ans.good{background:#4caf50;animation:pop .4s}
.ans.reveal{background:#4caf50;animation:pulse 1s infinite}
.bubble{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#fff;color:#2b2b2b;
  font-size:clamp(28px,4.5vw,52px);font-weight:900;padding:14px 30px;box-shadow:0 0 0 4px #1e1e1e,8px 8px 0 rgba(0,0,0,.3);
  transition:.25s;pointer-events:none;z-index:5;white-space:nowrap}
.bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bgrid{display:grid;gap:4px}
.addv{display:flex;align-items:center;gap:20px}
.op{font-size:calc(var(--b)*1.1);font-weight:900;text-shadow:3px 3px 0 #000}
.rods{display:flex;gap:6px;align-items:flex-end}
.rod{display:flex;flex-direction:column;gap:1px}
.ones{display:grid;grid-template-columns:repeat(5,calc(var(--b)*.42));gap:1px}
.cmp{display:flex;gap:clamp(16px,4vw,48px);align-items:flex-end}
.cmpc{display:flex;flex-direction:column;align-items:center;gap:8px}
.cmpn{font-size:clamp(26px,4vw,44px);font-weight:900;text-shadow:3px 3px 0 #000}
.nline{display:flex;gap:10px}
.nb{width:calc(var(--b)*1.5);height:calc(var(--b)*1.2);box-shadow:inset 0 0 0 3px rgba(0,0,0,.3)}
.nb>b{font-size:calc(var(--b)*.55)}
.steps{background:rgba(0,0,0,.45);padding:14px 26px;font-size:clamp(22px,3.4vw,38px);font-weight:900;line-height:1.6;box-shadow:0 0 0 4px #1e1e1e;text-shadow:2px 2px 0 #000}
.mrows{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:3px}
.mrow span{margin-left:12px;font-size:clamp(18px,2.6vw,28px);font-weight:900;text-shadow:2px 2px 0 #000;min-width:2.2em}

/* 結果 / 家 / 晚安 */
.panel{margin:auto;background:rgba(0,0,0,.45);padding:26px 40px;box-shadow:0 0 0 4px #1e1e1e;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;position:relative;z-index:1}
.rewards{display:flex;gap:40px;font-size:clamp(30px,4.5vw,48px);font-weight:900;text-shadow:3px 3px 0 #000}
.rw{display:flex;align-items:center;gap:10px}
.rw img,.rw .blk{width:60px;height:60px}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.badge{background:#c9932a;padding:6px 16px;font-weight:900;font-size:22px;box-shadow:0 0 0 3px #1e1e1e;animation:pop .5s}
.lvup{font-size:24px;font-weight:900;color:#ffe14d;text-shadow:2px 2px 0 #000}
.house{display:grid;grid-template-columns:repeat(12,var(--hb));--hb:min(5vw,5.8vh);margin:0 auto}
.hc{width:var(--hb);height:var(--hb)}
.hc.need{outline:2px dashed rgba(255,255,255,.7);outline-offset:-4px;background:rgba(255,255,255,.12)}
.hc.new{animation:pop .5s}
.hmsg{font-size:clamp(20px,3vw,32px);font-weight:900;text-shadow:2px 2px 0 #000;text-align:center;margin:10px 0}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.badges .bd{background:#c9932a;padding:4px 12px;font-weight:900;box-shadow:0 0 0 3px #1e1e1e}
.badges .bd.no{background:#555;opacity:.6}
.tw{position:absolute;width:6px;height:6px;background:#fff;animation:tw 2.4s infinite}
.moon{position:absolute;top:8%;right:10%;width:96px;height:96px}
.byeface{width:120px;height:120px;box-shadow:0 0 0 4px #1e1e1e;filter:brightness(.85)}

/* 家長 */
.parent{background:#ece6d9;color:#2b2b2b;overflow:auto;display:block;-webkit-overflow-scrolling:touch}
.ptop{position:sticky;top:0;background:#5d4a33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:2;font-weight:900;font-size:22px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
@media (max-width:800px){.pcards{grid-template-columns:1fr}}
.pcard{background:#fff;box-shadow:0 0 0 3px #3b2f22;padding:14px 16px}
.pcard h3{margin:0 0 6px;display:flex;align-items:center;gap:10px}
.pname{font:inherit;font-size:22px;font-weight:900;border:2px solid #cbbfa8;padding:4px 8px;width:60%}
.psec{margin-top:14px;padding:4px 8px;background:#5d4a33;color:#fff;font-weight:900}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #eee;gap:8px;flex-wrap:wrap}
.pbtn{font:inherit;font-weight:700;border:0;background:#8b6f4e;color:#fff;padding:7px 12px;box-shadow:0 0 0 2px #3b2f22;cursor:pointer;min-width:40px}
.pbtn.light{background:#ddd2bd;color:#2b2b2b}.pbtn.red{background:#b84a3a}
.pnote{font-size:14px;color:#7a6a55;padding:6px 2px}
.av{width:40px;height:40px;cursor:pointer;opacity:.45;box-shadow:0 0 0 2px #3b2f22}
.av.sel{opacity:1;box-shadow:0 0 0 3px #e8892b}
.avs{display:flex;gap:8px}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px;padding:6px 2px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:12px;height:100%}
.bar i{display:block;width:100%;background:#6aa84f;min-height:2px}
.ptable{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.ptable td,.ptable th{border-bottom:1px solid #eee;padding:4px;text-align:left}
.mist{font-size:15px;padding:4px 2px;border-bottom:1px dashed #ddd}
.gate{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10}
.gbox{background:#ece6d9;color:#2b2b2b;padding:20px 26px;box-shadow:0 0 0 4px #3b2f22;text-align:center}
.dots{font-size:36px;letter-spacing:12px;margin:8px 0 12px;min-height:44px}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.keys .pbtn{font-size:26px;height:60px}

/* 注音、英文 */
.ans.emo{font-size:clamp(44px,7vw,80px);background:#f3ead7;text-shadow:none}
.ans.zy{font-size:clamp(40px,6vw,70px);letter-spacing:.05em}
.ans.word{font-size:clamp(30px,4.6vw,54px);text-transform:none}
.listen{font-size:clamp(70px,12vw,140px);animation:bob 2s ease-in-out infinite}
.bigemo{font-size:clamp(90px,15vw,170px);line-height:1;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.35))}
.qtext.en{font-family:"Avenir Next","Trebuchet MS",sans-serif;letter-spacing:.12em}
.tip{display:flex;align-items:center;gap:24px;background:rgba(0,0,0,.45);padding:12px 30px;box-shadow:0 0 0 4px #1e1e1e;font-weight:900;font-size:clamp(28px,4.4vw,52px);text-shadow:3px 3px 0 #000}
.tip .emo{font-size:1.6em;text-shadow:none}
.tip .zyb{color:#ffe14d;font-size:1.3em}
.tones{display:grid;grid-template-columns:repeat(4,auto);gap:10px 26px;background:rgba(0,0,0,.45);padding:14px 26px;box-shadow:0 0 0 4px #1e1e1e;font-weight:900;font-size:clamp(20px,3vw,34px);text-shadow:2px 2px 0 #000;text-align:center}
.tones b{font-size:1.5em;color:#ffe14d}
.recgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin:8px 0}
.recgrid .pbtn{font-size:22px;padding:6px 0}
.recgrid .pbtn.has{background:#6aa84f;color:#fff}
.recgrid .pbtn.sel{outline:3px solid #e8892b;outline-offset:2px}

/* 專注力礦洞 */
.cavegrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;padding:18px 24px 20px;min-height:0}
.fgame{border:0;font:inherit;color:#fff;cursor:pointer;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 0 0 4px #1e1e1e,inset 0 -8px 0 rgba(0,0,0,.35)}
.fgame:active{transform:translateY(3px)}
.ficon{display:flex;gap:10px;align-items:center;height:clamp(60px,12vh,110px)}
.ficon>img,.ficon>.blk{height:100%;width:auto;aspect-ratio:1;box-shadow:0 0 0 3px #1e1e1e}
.mini{display:grid;gap:2px;height:100%;aspect-ratio:1}
.mini i{width:100%;height:100%}
.mini .lit{filter:brightness(1.8)}
.cap{font-size:clamp(22px,3.4vw,38px);font-weight:900;text-shadow:3px 3px 0 #000;background:rgba(0,0,0,.4);padding:6px 20px;box-shadow:0 0 0 3px #1e1e1e}
.farea{flex:1;display:flex;align-items:center;justify-content:center;gap:28px;min-height:0;padding:8px 16px 20px}
.mgrid{display:grid;gap:12px}
.card{width:var(--cw);height:var(--cw);border:0;padding:0;position:relative;cursor:pointer;background:none;box-shadow:0 0 0 3px #1e1e1e}
.card .back,.card .front{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card .back{font-size:calc(var(--cw)*.45);font-weight:900;color:#ffe9b0;text-shadow:3px 3px 0 #000}
.card .front{background:#f3ead7;display:none}
.card.open .front{display:flex}.card.open .back{display:none}
.card .front>*{width:70%;height:70%}
.card.flip{animation:flip .25s}
.card.done{box-shadow:0 0 0 5px #4caf50}
.sgrid{display:grid;gap:14px}
.tile{width:var(--tw);height:var(--tw);border:0;cursor:pointer;box-shadow:0 0 0 4px #1e1e1e,inset 0 0 0 4px rgba(0,0,0,.25);transition:transform .1s,filter .1s}
.tile.lit{filter:brightness(1.8) saturate(1.4);transform:scale(1.08);box-shadow:0 0 0 5px #fff,0 0 36px 8px rgba(255,255,255,.8)}
.tile.guide{outline:6px dashed #ffe14d;outline-offset:5px}
.demo{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center}
.demo>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:clamp(22px,3vw,34px);font-weight:900;text-shadow:2px 2px 0 #000}
.demo img{width:clamp(90px,14vw,150px);height:clamp(90px,14vw,150px);box-shadow:0 0 0 4px #1e1e1e}
.okc{color:#7dff8a}.ngc{color:#ff8a8a}
.holes{display:grid;gap:clamp(14px,3vw,36px)}
.hole{width:var(--hw);height:var(--hw);position:relative;box-shadow:0 0 0 4px #1e1e1e;cursor:pointer}
.pit{position:absolute;left:12%;right:12%;top:20%;bottom:8%;background:#1a120a;overflow:hidden;box-shadow:inset 0 8px 0 rgba(0,0,0,.6)}
.crt{position:absolute;left:5%;width:90%;height:90%;bottom:0;transform:translateY(110%);transition:transform .15s}
.crt.up{transform:translateY(5%)}
.maze{display:grid;touch-action:none;box-shadow:0 0 0 4px #1e1e1e}
.mc{width:var(--mc);height:var(--mc);position:relative}
.mc.seen::after{content:"";position:absolute;inset:32%;background:rgba(255,236,150,.8)}
.mc.hp::after{content:"";position:absolute;inset:22%;background:#ffe14d;box-shadow:0 0 10px #fff;animation:pulse .8s infinite}
.mc>img{position:absolute;inset:4%;width:92%;height:92%;z-index:1}
.pad{display:grid;grid-template-columns:repeat(3,clamp(56px,7vw,80px));grid-template-rows:repeat(3,clamp(56px,7vw,80px));gap:6px}
.pad .btn{padding:0;font-size:clamp(24px,3.4vw,38px)}

.shake{animation:shake .4s}
@keyframes flip{50%{transform:scaleX(0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes drift{to{transform:translateX(calc(100vw + 440px))}}
@keyframes tw{50%{opacity:.2}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const app = document.getElementById('app');
const KEY = 'blockIsland.v1';
const S = { data: null, child: null, screen: 'login', game: null, warned: false, sunset: false, endPending: false, pinBuf: '' };

/* ---------- 工具 ---------- */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => fmt(new Date());

let AC = null;
function beep(freqs, dur = .12, type = 'square', vol = .07) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t + i * dur);
      g.gain.exponentialRampToValueAtTime(.001, t + (i + 1) * dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t + i * dur); o.stop(t + (i + 1) * dur);
    });
  } catch (e) {}
}
const SFX = {
  tap: () => beep([520], .05),
  ok: () => beep([660, 880, 1320], .09),
  no: () => beep([240, 190], .14, 'triangle', .1),
  win: () => beep([523, 659, 784, 1046], .13),
};
let ZH = null, EN = null;
function pickVoice() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  ZH = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  EN = vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function utter(text, en, rate) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = en ? 'en-US' : 'zh-TW';
  const v = en ? EN : ZH; if (v) u.voice = v;
  u.rate = rate || (en ? .8 : .9); u.pitch = en ? 1 : 1.1;
  return u;
}
let sayTok = 0, curAudio = null;
function stopVoice() {
  sayTok++;
  if (curAudio) { curAudio.pause(); curAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
}
// 原型先用裝置內建語音；正式版會換成事先錄好的台灣口音音檔
function speak(text, opt = {}) {
  try {
    if (!opt.queue) stopVoice();
    speechSynthesis.speak(utter(text, opt.en, opt.rate));
  } catch (e) {}
}
// 依序念出多段：{text} 中文、{text, en:true} 英文、{sym} 注音符號（有家長錄音就播錄音）
function sayParts(parts) {
  stopVoice();
  const tok = sayTok;
  const next = i => {
    if (tok !== sayTok || i >= parts.length) return;
    const p = parts[i];
    let fired = false;
    const done = () => { if (!fired) { fired = true; next(i + 1); } };
    if (p.sym && REC.has(p.sym)) {
      const a = curAudio = new Audio(REC.get(p.sym));
      a.onended = done; a.onerror = done; a.play().catch(done);
      setTimeout(done, 3000);
      return;
    }
    const text = p.sym ? ZY[p.sym][0] : p.text;
    try {
      const u = utter(text, p.en, p.rate);
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
    } catch (e) { return done(); }
    // iPad 偶爾不觸發 onend，用時間保底
    setTimeout(done, 900 + text.length * (p.en ? 120 : 320) / (p.rate || 1));
  };
  next(0);
}

/* ---------- 家長錄音（注音符號的標準發音） ---------- */
// 錄音存在這台 iPad 的 IndexedDB，不會上傳
const REC = new Map();
let recDB = null;
function openRecDB() {
  return recDB ? Promise.resolve(recDB) : new Promise((res, rej) => {
    const r = indexedDB.open('blockIsland-audio', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('rec');
    r.onsuccess = () => res(recDB = r.result);
    r.onerror = () => rej(r.error);
  });
}
async function loadRecs() {
  try {
    const db = await openRecDB(), req = db.transaction('rec').objectStore('rec').openCursor();
    req.onsuccess = () => {
      const cur = req.result; if (!cur) return;
      REC.set(cur.key, URL.createObjectURL(new Blob([cur.value.buf], { type: cur.value.type })));
      cur.continue();
    };
  } catch (e) {}
}
async function storeRec(sym, blob) {
  const db = await openRecDB(), buf = await blob.arrayBuffer();
  await new Promise((res, rej) => {
    const tx = db.transaction('rec', 'readwrite');
    if (blob) tx.objectStore('rec').put({ buf, type: blob.type }, sym);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
  if (REC.has(sym)) URL.revokeObjectURL(REC.get(sym));
  REC.set(sym, URL.createObjectURL(blob));
}
async function deleteRec(sym) {
  const db = await openRecDB();
  await new Promise(res => { const tx = db.transaction('rec', 'readwrite'); tx.objectStore('rec').delete(sym); tx.oncomplete = res; tx.onerror = res; });
  if (REC.has(sym)) URL.revokeObjectURL(REC.get(sym));
  REC.delete(sym);
}
async function recordSym(sym) {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { alert('無法使用麥克風。請到 iPad 的「設定 → Safari → 麥克風」允許使用後再試一次。'); return; }
  const mime = ['audio/mp4', 'audio/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), chunks = [];
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    try { await storeRec(sym, new Blob(chunks, { type: mr.mimeType || mime || 'audio/mp4' })); } catch (e) { alert('錄音儲存失敗，請再試一次。'); }
    S.recBusy = false; renderParent(); sayParts([{ sym }]);
  };
  S.recBusy = true; renderParent();
  mr.start();
  setTimeout(() => mr.stop(), 1800);
}

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
function noise(x, r, cols) { for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) { x.fillStyle = cols[Math.floor(r() * cols.length)]; x.fillRect(i, j, 1, 1); } }
function spots(x, r, cols) {

    const sx = 1 + Math.floor(r() * 12), sy = 1 + Math.floor(r() * 12);
    for (const [dx, dy] of [[0, 0], [1, 0], [0, 1], [1, 1], [2, 1]]) if (r() < .85) { x.fillStyle = cols[Math.floor(r() * cols.length)]; x.fillRect(sx + dx, sy + dy, 1, 1); }

}

const LEVELS = [null, '數數 1–10', '數數 11–30', '下一個數字（到 100）', '比大小', '加法（看方塊）', '加法 10 以內', '二位數加法', '二位數減法', '九九乘法'];
function opts(ans, lo, hi, spread = 3, n = 4, extra = []) {
  const s = new Set([ans]);
  extra.forEach(v => { if (v >= lo && v <= hi && s.size < n) s.add(v); });
  for (let t = 0; s.size < n && t < 300; t++) { const v = ans + ri(-spread, spread); if (v >= lo && v <= hi) s.add(v); }
  for (let v = lo; s.size < n && v <= hi; v++) s.add(v);
  return shuffle([...s]);
}
function grid(n, tex, perRow, labels, start = 1, tex2 = null, split = 0) {
  let h = `<div class="bgrid" style="grid-template-columns:repeat(${Math.min(n, perRow)},var(--b))">`;
  for (let i = 0; i < n; i++) {
    const t = tex2 && i >= split ? tex2 : tex;
    h += `<i class="blk b t-${t}">${labels ? `<b style="animation-delay:${i * .12}s">${start + i}</b>` : ''}</i>`;
  }
  return h + '</div>';
}
function rods(n) {
  const t = Math.floor(n / 10), o = n % 10;
  let h = '<div class="rods">';
  for (let i = 0; i < t; i++) h += '<div class="rod">' + '<i class="blk s t-planks"></i>'.repeat(10) + '</div>';
  return h + '<div class="ones">' + '<i class="blk s t-grass"></i>'.repeat(o) + '</div></div>';
}

function logQ(ok) {
  const c = S.child, g = S.game, q = g.q;
  c.log.push({ t: Date.now(), s: g.subject, L: q.L, q: q.rec || q.display, ans: q.answer, ok, picks: g.wrong.slice() });

function adapt(kind) {
  const g = S.game, p = P(S.child, g.subject);
  if (kind === 'first') { g.fs++; g.ff = 0; } else if (kind === 'ok') { g.fs = 0; g.ff = 0; } else { g.ff++; g.fs = 0; }
  if (g.fs >= 3 && p.level < p.maxLevel) {
    p.level++; g.fs = 0; g.levelUp = true;
    setTimeout(() => { bubble('題目升級了！⬆'); speak('你變厲害了，題目升級囉！', { queue: true }); }, 800);
  }
  // 降級時不特別告訴孩子，避免挫折感
  if (g.ff >= 2 && p.level > p.minLevel) { p.level--; g.ff = 0; }
}
function onAnswer(i, el) {
  const g = S.game, c = S.child;
  if (!g || g.state !== 'asking') return;
  const q = g.q, v = q.options[i];
  g.attempts++;
  if (v === q.answer) {
    g.state = 'done'; SFX.ok(); el.classList.add('good');
    const first = g.attempts === 1;
    c.totalCorrect++;
    if (first) { c.stars++; U(c).stars++; g.starsEarned++; g.correctFirst++; }
    const praise = first ? pick(['答對了！', '好厲害！', '太棒了！', '完全正確！']) : pick(['答對了！你沒有放棄，好棒！', '對了！越來越厲害！']);
    bubble(first ? praise + ' +1 ⭐' : praise); speak(praise);
    logQ(first); adapt(first ? 'first' : 'ok');
    later(() => { g.idx++; nextQ(); }, 1500);
  } else {
    SFX.no(); g.wrong.push(v); el.classList.add('off', 'shake');
    if (g.attempts === 1) { bubble('再想想看喔！'); speak('再想想看喔！'); }
    else if (g.attempts === 2) { showHint(); bubble('一起看提示 💡'); sayParts([{ text: '沒關係，我們一起看提示！' }, ...(q.hintParts || [])]); }
    else {
      g.state = 'done';
      document.querySelectorAll('.ans').forEach(b => { if (q.options[+b.dataset.v] === q.answer) { b.classList.remove('off'); b.classList.add('reveal'); } });
      bubble(`答案是 ${q.ansLabel || q.answer}`, 2400);
      sayParts([{ text: '答案是' }, ...(q.ansParts || [{ text: String(q.answer) }]), { text: '，下次一定可以！' }]);
      logQ(false); adapt('fail');
      later(() => { g.idx++; nextQ(); }, 2800);
    }
  }
  updateHud(); save();
}

const FACES = ['t-grass', 't-planks', 't-sand', 't-gold', 't-deep', 't-log', 't-snow', 's-star', 's-sun', 's-moon', 's-heart', 's-pig', 's-mon'];
const faceHTML = f => f[0] === 't' ? `<i class="blk ${f}"></i>` : `<img class="px" src="${SPR[f.slice(2)]}">`;
function startMemory() {
  const L = flv('memory'), pairs = [3, 4, 6, 8, 10][L - 1], cols = [3, 4, 4, 4, 5][L - 1], rows = pairs * 2 / cols;
  const faces = shuffle(FACES.slice()).slice(0, pairs);
  const cards = shuffle([...faces, ...faces]).map(f => ({ f, open: false, done: false }));
  S.fg = { game: 'memory', L, pairs, cards, first: null, lock: false, moves: 0, matched: 0, miss: 0, freePeek: false };
  const cw = `min(calc((100vw - 80px) / ${cols} - 12px), calc((100vh - 200px) / ${rows} - 12px), 150px)`;
  focusShell('找出一樣的兩張！', true, `<div class="mgrid" style="grid-template-columns:repeat(${cols},var(--cw));--cw:${cw}">${cards.map((c, i) =>
    `<button class="card" data-act="mcard" data-v="${i}"><span class="back blk t-dirt">?</span><span class="front">${faceHTML(c.f)}</span></button>`).join('')}</div>`);
  speak(FGAMES.memory.say);

function peek(ms) {
  const g = S.fg; g.lock = true;
  document.querySelectorAll('.card').forEach(e => e.classList.add('open'));
  later(() => {
    document.querySelectorAll('.card').forEach((e, i) => e.classList.toggle('open', g.cards[i].open || g.cards[i].done));
    g.lock = false;
  }, ms);
}
function memTap(i) {
  const g = S.fg, c = g && g.cards && g.cards[i];
  if (!c || g.lock || c.open || c.done) return;
  const el = document.querySelectorAll('.card');
  c.open = true; el[i].classList.add('open', 'flip'); SFX.tap();
  if (g.first === null) { g.first = i; return; }
  const j = g.first, a = g.cards[j];
  g.first = null; g.moves++;
  if (a.f === c.f) {
    a.done = c.done = true; g.matched++; g.miss = 0;
    el[i].classList.add('done'); el[j].classList.add('done'); SFX.ok();
    bubble(pick(['一樣的！', '找到了！', '好眼力！']), 900);
    if (g.matched === g.pairs) later(() => {
      const r = g.moves / g.pairs;
      endFocus(r <= 1.5 ? 3 : r <= 2.5 ? 2 : 1, r <= 2, r > 3.5, `${g.pairs} 對，翻了 ${g.moves} 次`);
    }, 1000);
  } else {
    g.lock = true; g.miss++;
    later(() => {
      a.open = c.open = false;
      el[i].classList.remove('open', 'flip'); el[j].classList.remove('open', 'flip');
      g.lock = false;
      if (g.miss >= 4 && !g.freePeek) { g.freePeek = true; g.miss = 0; bubble('偷看一下 👀'); speak('沒關係，我們偷看一下！'); peek(1500); }
    }, 1000);
  }
}

const TONES = [262, 294, 330, 349, 392, 440, 494, 523, 587];
const SEQTEX = ['grass', 'sand', 'deep', 'planks', 'gold', 'log', 'snow', 'glass', 'cobble'];
function startSeq() {
  const L = flv('seq'), size = L <= 2 ? 2 : 3;
  S.fg = { game: 'seq', L, size, len: L + 1, round: 0, rounds: 3, firstOK: 0, fails: 0, input: false };
  const tw = `min(calc((100vh - 230px) / ${size} - 14px), 170px)`;
  focusShell('仔細看…', true, `<div class="sgrid" style="grid-template-columns:repeat(${size},var(--tw));--tw:${tw}">${SEQTEX.slice(0, size * size).map((t, i) =>
    `<button class="tile blk t-${t}" data-act="tile" data-v="${i}"></button>`).join('')}</div>`);
  speak(FGAMES.seq.say);
  later(newSeq, 4500);
}
function newSeq() {
  const g = S.fg, n = g.size * g.size, len = g.len + (g.round === 2 ? 1 : 0);
  g.seq = [];
  while (g.seq.length < len) { const v = ri(0, n - 1); if (v !== g.seq[g.seq.length - 1]) g.seq.push(v); }
  g.tries = 0; g.guide = false;
  playSeq();
}
function flash(i, ms) {
  const el = document.querySelectorAll('.tile')[i]; if (!el) return;
  el.classList.add('lit'); beep([TONES[i]], ms / 1000 * .8, 'triangle', .12);
  later(() => el.classList.remove('lit'), ms);
}
const setGuide = i => document.querySelectorAll('.tile').forEach((e, k) => e.classList.toggle('guide', k === i));
function playSeq() {
  const g = S.fg, gap = (g.L <= 2 ? 1000 : 800) * (g.guide ? 1.3 : 1);
  g.input = false; setCap('仔細看…'); setGuide(-1);
  g.seq.forEach((v, k) => later(() => flash(v, gap * .6), 600 + k * gap));
  later(() => { g.input = true; g.pos = 0; setCap('換你了！'); speak('換你了！'); if (g.guide) setGuide(g.seq[0]); }, 600 + g.seq.length * gap);
}
function seqTap(i) {
  const g = S.fg; if (!g || !g.input) return;
  flash(i, 250);
  if (i === g.seq[g.pos]) {
    g.pos++;
    if (g.guide) setGuide(g.pos < g.seq.length ? g.seq[g.pos] : -1);
    if (g.pos < g.seq.length) return;
    g.input = false;
    if (g.tries === 0) g.firstOK++;
    later(() => { SFX.ok(); bubble(pick(['記得好清楚！', '完全正確！', '好厲害！']), 1000); }, 300);
    nextSeqRound(1600);
  } else {
    g.input = false; g.tries++; SFX.no(); setGuide(-1);
    if (g.tries === 1) { bubble('再看一次喔！'); speak('再看一次喔！'); later(playSeq, 1500); }
    else if (g.tries === 2) { g.guide = true; bubble('跟著發亮的方塊點 💡'); speak('沒關係，跟著發亮的方塊點！'); later(playSeq, 2000); }
    else { g.fails++; bubble('沒關係，下一題！'); speak('沒關係，我們換下一題！'); nextSeqRound(1800); }
  }
}
function nextSeqRound(ms) {
  const g = S.fg; g.round++;
  if (g.round >= g.rounds) later(() => endFocus(Math.max(1, g.firstOK), g.firstOK === 3, g.fails >= 2, `${g.len} 個方塊，一次記住 ${g.firstOK}/3`), ms);
  else later(newSeq, ms);
}

/* 礦洞迷宮 */
function genMaze(n) {
  const W = 2 * n + 1, m = Array(W * W).fill(1), st = [[0, 0]], seen = new Set(['0,0']);
  m[W + 1] = 0;
  while (st.length) {
    const [x, y] = st[st.length - 1];
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy])
      .filter(([a, b]) => a >= 0 && b >= 0 && a < n && b < n && !seen.has(a + ',' + b));
    if (!nb.length) { st.pop(); continue; }
    const [a, b] = pick(nb);
    seen.add(a + ',' + b);
    m[(2 * b + 1) * W + 2 * a + 1] = 0; m[(y + b + 1) * W + x + a + 1] = 0;
    st.push([a, b]);
  }
  return { W, m };
}
function startMaze() {
  const L = flv('maze'), n = L + 3, { W, m } = genMaze(n), goal = W * W - W - 2;
  const g = S.fg = { game: 'maze', L, n, W, m, goal, pos: W + 1, hints: 0, freeHint: false, t0: Date.now(), done: false, drag: false };
  const mc = `min(calc((100vh - 220px) / ${W}), calc((100vw - 330px) / ${W}), 60px)`;
  const cells = m.map((v, i) => `<div class="mc blk ${i === goal ? 't-gold' : v ? 't-cobble' : 't-grass'}" data-i="${i}">${i === goal ? `<img class="px" src="${SPR.star}">` : ''}</div>`).join('');
  const arrow = (d, s) => `<button class="btn" data-act="mz" data-d="${d}">${s}</button>`;
  focusShell('走到星星那裡！', true, `<div class="maze" id="maze" style="grid-template-columns:repeat(${W},var(--mc));--mc:${mc}">${cells}</div>
    <div class="pad"><span></span>${arrow(-W, '▲')}<span></span>${arrow(-1, '◀')}<span></span>${arrow(1, '▶')}<span></span>${arrow(W, '▼')}<span></span></div>`);
  drawPlayer();
  const mz = document.getElementById('maze');
  const at = e => { const el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest('.mc'); return c ? +c.dataset.i : -1; };
  mz.addEventListener('pointerdown', e => { g.drag = true; mazeTo(at(e)); });
  mz.addEventListener('pointermove', e => { if (g.drag) mazeTo(at(e)); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => mz.addEventListener(t, () => g.drag = false));
  speak(FGAMES.maze.say);
  // 卡太久就免費給一次提示
  const tick = () => {

    if (!g.freeHint && Date.now() - g.t0 > n * 10000) { g.freeHint = true; speak('我們看一下要往哪裡走！'); showPath(6); }

}
function drawPlayer() {
  const g = S.fg, old = document.getElementById('me');
  if (old) old.remove();

// 點同一排或同一列的格子，會一路走過去直到碰到牆
function mazeTo(t) {
  const g = S.fg;
  if (!g || g.game !== 'maze' || g.done || t < 0 || t === g.pos) return;
  const W = g.W, px = g.pos % W, py = (g.pos / W) | 0, tx = t % W, ty = (t / W) | 0;
  let d;
  if (py === ty) d = tx > px ? 1 : -1; else if (px === tx) d = ty > py ? W : -W; else return;
  let moved = false;
  while (g.pos !== t && !g.m[g.pos + d]) {

    document.querySelector(`.mc[data-i="${g.pos}"]`).classList.add('seen');

  if (!moved) return;
  drawPlayer(); beep([620], .03);
  if (g.pos === g.goal) {
    g.done = true; SFX.ok(); bubble('找到星星了！⭐', 1200);
    const secs = Math.round((Date.now() - g.t0) / 1000), helped = g.hints + (g.freeHint ? 1 : 0);
    later(() => endFocus(helped === 0 ? 3 : helped === 1 ? 2 : 1, helped === 0, g.freeHint, `${g.n}×${g.n} 迷宮，${secs} 秒`), 1300);

  const g = S.fg, prev = new Map([[g.pos, -1]]), q = [g.pos];

    for (const d of [1, -1, g.W, -g.W]) { const n = c + d; if (!g.m[n] && !prev.has(n)) { prev.set(n, c); q.push(n); } }

  if (u.sec % 5 === 0) save();
  updateHud();
  const rem = remaining(c);
  if (rem <= 180 && !S.warned) warnSunset();
  if (rem <= 0) {
    // 讓孩子把手上這題／這局做完再道別；超時 3 分鐘仍未結束就直接道別
    if (S.screen === 'game' || S.screen === 'focus') { S.endPending = true; if (rem < -180) goodbye(); }
    else if (!(S.screen === 'result' && Date.now() - S.resultAt < 6000)) goodbye();
  }
}, 1000);
document.addEventListener('visibilitychange', save);

S.data = load();
initArt();
renderLogin();
loadRecs();

// 放到網址上才會啟用離線快取；直接開檔案時略過
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
// 請瀏覽器不要自動清掉孩子的進度
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
