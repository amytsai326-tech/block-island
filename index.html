<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="方塊學習島">
<meta name="theme-color" content="#5fb0ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>方塊學習島</title>
<style>
:root{--b:clamp(30px,4.6vw,58px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;background:#7ec8ff;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
input{user-select:text;-webkit-user-select:text}
#app{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.sky{background:linear-gradient(#5fb0ff,#b6e0ff)}
.sky.sunset{background:linear-gradient(#ff8a4c,#ffb98a 55%,#ffe0b8)}
.night{background:linear-gradient(#0b1640,#28306b 70%,#3c3f86)}
.px{image-rendering:pixelated}
.blk{display:inline-block;background-size:100% 100%;image-rendering:pixelated;position:relative}
.tiled{background-size:var(--tile,64px) var(--tile,64px);image-rendering:pixelated}
.b{width:var(--b);height:var(--b);box-shadow:inset 0 0 0 2px rgba(0,0,0,.22)}
.b>b,.nb>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.48);
  color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:pop .3s both}
.s{width:calc(var(--b)*.42);height:calc(var(--b)*.42)}

.btn{font:inherit;font-weight:900;color:#fff;border:0;cursor:pointer;background:#8b8b8b;padding:.45em .9em;
  text-shadow:2px 2px 0 rgba(0,0,0,.5);font-size:clamp(16px,2.2vw,24px);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.3),0 0 0 3px #1e1e1e}
.btn:active{transform:translateY(2px);filter:brightness(.9)}
.btn.green{background:#4caf50}.btn.blue{background:#3d7bd9}.btn.orange{background:#e8892b}
.btn.small{padding:.2em .6em}.btn.big{font-size:clamp(22px,3.2vw,34px)}

/* 登入 */
.login{align-items:center;justify-content:center;gap:2vh}
.title{font-size:clamp(36px,7vw,80px);font-weight:900;text-shadow:5px 5px 0 #2f4f2f;letter-spacing:.06em;z-index:1}
.title.sm{font-size:clamp(32px,5vw,56px)}
.sub{font-size:clamp(18px,2.6vw,28px);font-weight:900;text-shadow:2px 2px 0 #335;z-index:1}
.kids{display:flex;flex-wrap:wrap;justify-content:center;gap:4vw;z-index:1;margin-bottom:14vh;max-width:94vw}
.kid{background:rgba(0,0,0,.28);border:0;padding:18px 22px 14px;color:#fff;font:inherit;font-weight:900;position:relative;cursor:pointer;
  box-shadow:0 0 0 4px #1e1e1e,inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.2);animation:bob 3s ease-in-out infinite}
.kid:nth-child(2){animation-delay:-1.5s}
.kid .face{width:clamp(110px,16vw,180px);height:clamp(110px,16vw,180px);display:block;box-shadow:0 0 0 4px #1e1e1e}
.kname{font-size:clamp(20px,3vw,32px);margin-top:10px;text-shadow:2px 2px 0 #000}
.kmeta{font-size:18px;opacity:.9}
.kid.sleep .face{filter:grayscale(.6) brightness(.6)}
.zzz{position:absolute;top:8px;right:12px;font-size:34px;font-weight:900;color:#cfe3ff;text-shadow:2px 2px 0 #000;animation:float 2s ease-in-out infinite}
.ground{position:absolute;left:0;right:0;bottom:0;height:16vh;--tile:64px}
.grassrow{height:64px}.dirtrow{position:absolute;top:64px;bottom:0;left:0;right:0}
.gear{position:absolute;right:16px;bottom:16px;z-index:2;font-size:18px}
.cloud{position:absolute;left:-220px;width:180px;height:44px;background:#fff;opacity:.9;animation:drift linear infinite}
.cloud::after{content:"";position:absolute;left:36px;top:-26px;width:90px;height:26px;background:#fff}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(0,0,0,.35);font-weight:900;font-size:clamp(16px,2.2vw,24px);flex:none}
.hface{width:44px;height:44px;box-shadow:0 0 0 3px #1e1e1e}
.hname{text-shadow:2px 2px 0 #000;white-space:nowrap}
.daybar{flex:1;height:18px;background:#1d2b4a;position:relative;box-shadow:0 0 0 3px #1e1e1e;margin:0 18px}
.dayfill{height:100%;background:linear-gradient(90deg,#ffd166,#ffe9a8);transition:width 1s linear}
.daybar.late .dayfill{background:linear-gradient(90deg,#ff6b2a,#ffae5c)}
.sunico{position:absolute;top:-9px;width:30px;height:30px;transition:left 1s linear}
.pill{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);padding:4px 8px;box-shadow:0 0 0 2px #1e1e1e;text-shadow:2px 2px 0 #000}
.ico{width:24px;height:24px}
.pulse{animation:pop .4s}
.banner{position:absolute;top:78px;left:50%;transform:translateX(-50%);background:#e8692b;padding:8px 22px;font-weight:900;
  font-size:clamp(18px,2.4vw,26px);box-shadow:0 0 0 3px #1e1e1e;z-index:6;white-space:nowrap;text-shadow:2px 2px 0 #000;animation:pop .4s}

/* 地圖 */
.mapgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr .62fr;gap:14px 18px;padding:14px 24px 8px;min-height:0}
/* 釣魚池、金礦山：不算每日任務，格子小一點 */
.biome.extra .sym{font-size:clamp(30px,5vw,56px)}
.biome.water{background:repeating-linear-gradient(170deg,rgba(255,255,255,.14) 0 6px,transparent 6px 26px),linear-gradient(#5ec3ff,#2a78c8)}
.biome.extra.locked::after{content:none}
.mapbar.small .btn{font-size:clamp(16px,2.2vw,22px);padding:.35em .9em}
@media (orientation:landscape){.mapgrid{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}}
.biome{position:relative;border:0;font:inherit;color:#fff;cursor:pointer;--tile:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;
  box-shadow:0 0 0 4px #1e1e1e,inset 0 -10px 0 rgba(0,0,0,.25)}
.biome:active{transform:translateY(3px)}
.biome .sym{font-size:clamp(40px,7vw,84px);font-weight:900;text-shadow:5px 5px 0 rgba(0,0,0,.55);line-height:1}
.bname{font-size:clamp(20px,3vw,32px);font-weight:900;background:rgba(0,0,0,.45);padding:2px 14px;text-shadow:2px 2px 0 #000}
.lv{font-size:clamp(14px,1.8vw,18px);font-weight:900;background:rgba(0,0,0,.4);padding:2px 10px}
.biome.locked .sym{opacity:.55}
.biome.locked::after{content:"🔒 即將開放";position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);padding:4px 10px;font-size:16px;font-weight:900}
.mapbar{display:flex;gap:16px;justify-content:center;padding:8px 0 16px;flex:none}

/* 遊戲 */
.gtop{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 6px;flex:none}
.pips{display:flex;gap:8px}
.pip{width:34px;height:34px;background:rgba(0,0,0,.3);box-shadow:0 0 0 3px #1e1e1e}
.pip.cur{outline:3px solid #ffd83a;outline-offset:3px}
.hintbtn{display:flex;align-items:center;gap:6px;background:#e8a72b}
.qcard{margin:4px auto 0;display:flex;align-items:center;gap:18px;background:rgba(0,0,0,.35);padding:8px 28px;box-shadow:0 0 0 4px #1e1e1e;flex:none}
.qtext{font-size:clamp(34px,6vw,72px);font-weight:900;text-shadow:4px 4px 0 #000;letter-spacing:.04em}
.visual{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0;overflow:hidden}
.answers{display:flex;justify-content:center;gap:clamp(12px,3vw,36px);padding:0 16px 3vh;flex:none}
.ans{min-width:clamp(90px,15vw,170px);font-size:clamp(34px,5.5vw,64px);padding:.2em .4em;background:#3d7bd9}
.ans.off{opacity:.3;filter:grayscale(1);pointer-events:none}
.ans.good{background:#4caf50;animation:pop .4s}
.ans.reveal{background:#4caf50;animation:pulse 1s infinite}
.bubble{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#fff;color:#2b2b2b;
  font-size:clamp(28px,4.5vw,52px);font-weight:900;padding:14px 30px;box-shadow:0 0 0 4px #1e1e1e,8px 8px 0 rgba(0,0,0,.3);
  transition:.25s;pointer-events:none;z-index:5;white-space:nowrap}
.bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bgrid{display:grid;gap:4px}
.addv{display:flex;align-items:center;gap:20px}
.op{font-size:calc(var(--b)*1.1);font-weight:900;text-shadow:3px 3px 0 #000}
.rods{display:flex;gap:6px;align-items:flex-end}
.rod{display:flex;flex-direction:column;gap:1px}
.ones{display:grid;grid-template-columns:repeat(5,calc(var(--b)*.42));gap:1px}
.cmp{display:flex;gap:clamp(16px,4vw,48px);align-items:flex-end}
.cmpc{display:flex;flex-direction:column;align-items:center;gap:8px}
.cmpn{font-size:clamp(26px,4vw,44px);font-weight:900;text-shadow:3px 3px 0 #000}
.nline{display:flex;gap:10px}
.nb{width:calc(var(--b)*1.5);height:calc(var(--b)*1.2);box-shadow:inset 0 0 0 3px rgba(0,0,0,.3)}
.nb>b{font-size:calc(var(--b)*.55)}
.steps{background:rgba(0,0,0,.45);padding:14px 26px;font-size:clamp(22px,3.4vw,38px);font-weight:900;line-height:1.6;box-shadow:0 0 0 4px #1e1e1e;text-shadow:2px 2px 0 #000}
.mrows{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:3px}
.mrow span{margin-left:12px;font-size:clamp(18px,2.6vw,28px);font-weight:900;text-shadow:2px 2px 0 #000;min-width:2.2em}

/* 結果 / 家 / 晚安 */
.panel{margin:auto;background:rgba(0,0,0,.45);padding:26px 40px;box-shadow:0 0 0 4px #1e1e1e;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;position:relative;z-index:1}
.rewards{display:flex;gap:40px;font-size:clamp(30px,4.5vw,48px);font-weight:900;text-shadow:3px 3px 0 #000}
.rw{display:flex;align-items:center;gap:10px}
.rw img,.rw .blk{width:60px;height:60px}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.badge{background:#c9932a;padding:6px 16px;font-weight:900;font-size:22px;box-shadow:0 0 0 3px #1e1e1e;animation:pop .5s}
.lvup{font-size:24px;font-weight:900;color:#ffe14d;text-shadow:2px 2px 0 #000}
.house{display:grid;grid-template-columns:repeat(12,var(--hb));--hb:min(12.8vw,11.2vh);margin:0 auto}
.hrow{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:center;gap:12px 28px;align-items:center;justify-content:center;overflow:hidden;padding:0 10px}
.hrow .hpal{flex-basis:100%}
/* 橫向：材料改放在房子右邊直排，房子大小由 fitHouse() 依剩下的空間決定 */
@media (orientation:landscape){
  .hrow{flex-wrap:nowrap}
  .hrow .hpal{flex-basis:auto;flex-direction:column;flex-wrap:nowrap;gap:8px}
  .hrow .hsrc{flex-direction:row;gap:8px;padding:4px 10px}
  .hrow .hsrc .blk{width:40px;height:40px}
}
@media (orientation:landscape) and (max-height:600px){.hrow .hpal{display:grid;grid-template-columns:auto auto}}
.hcheer{text-align:center;margin:2px auto 0;font-size:clamp(16px,2.2vw,22px)}
.town{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:4px 10px;flex:none;max-width:42vw}
.tb{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.25);padding:6px 8px;box-shadow:0 0 0 3px #1e1e1e}
.house.mini{--hb:9px}
.town.big{flex:1;align-content:center;gap:18px;max-width:none;min-height:0}
.town.big .house.mini{--hb:min(1.5vw,2.1vh)}
.tname{font-weight:900;font-size:16px;text-shadow:2px 2px 0 #000;margin-top:4px}
.pet{display:inline-block;animation:bob 1.6s ease-in-out infinite;font-size:1.3em}
.hc{width:var(--hb);height:var(--hb)}
.hc.need{outline:2px dashed rgba(255,255,255,.7);outline-offset:-4px;background:rgba(255,255,255,.12);position:relative}
.hc.need .gt{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.hc.want{outline:3px dashed #ffe14d;background:rgba(255,225,77,.3)}
.hc.over{outline:3px solid #fff;background:rgba(255,255,255,.5)}
.hpal{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:6px 10px;flex:none}
.hsrc{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.35);padding:8px 14px;box-shadow:0 0 0 3px #1e1e1e;touch-action:none;cursor:grab;font-weight:900;text-shadow:2px 2px 0 #000}
.hsrc .blk{width:56px;height:56px;box-shadow:0 0 0 2px #1e1e1e;animation:bob 1.6s ease-in-out infinite}
.hsrc b{font-size:22px}
.hsrc.empty{opacity:.35}
.hsrc.empty .blk{animation:none}
.hc.new{animation:pop .5s}
.hmsg{font-size:clamp(20px,3vw,32px);font-weight:900;text-shadow:2px 2px 0 #000;text-align:center;margin:10px 0}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.badges .bd{background:#c9932a;padding:4px 12px;font-weight:900;box-shadow:0 0 0 3px #1e1e1e}
.badges .bd.no{background:#555;opacity:.6}
.tw{position:absolute;width:6px;height:6px;background:#fff;animation:tw 2.4s infinite}
.moon{position:absolute;top:8%;right:10%;width:96px;height:96px}
.byeface{width:120px;height:120px;box-shadow:0 0 0 4px #1e1e1e;filter:brightness(.85)}

/* 家長 */
.parent{background:#ece6d9;color:#2b2b2b;overflow:auto;display:block;-webkit-overflow-scrolling:touch}
.ptop{position:sticky;top:0;background:#5d4a33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:2;font-weight:900;font-size:22px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
@media (max-width:800px){.pcards{grid-template-columns:1fr}}
.pcard{background:#fff;box-shadow:0 0 0 3px #3b2f22;padding:14px 16px}
.pcard h3{margin:0 0 6px;display:flex;align-items:center;gap:10px}
.pname{font:inherit;font-size:22px;font-weight:900;border:2px solid #cbbfa8;padding:4px 8px;width:60%}
.psec{margin-top:14px;padding:4px 8px;background:#5d4a33;color:#fff;font-weight:900}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #eee;gap:8px;flex-wrap:wrap}
.pbtn{font:inherit;font-weight:700;border:0;background:#8b6f4e;color:#fff;padding:7px 12px;box-shadow:0 0 0 2px #3b2f22;cursor:pointer;min-width:40px}
.pbtn.light{background:#ddd2bd;color:#2b2b2b}.pbtn.red{background:#b84a3a}
.pnote{font-size:14px;color:#7a6a55;padding:6px 2px}
.av{width:40px;height:40px;cursor:pointer;opacity:.45;box-shadow:0 0 0 2px #3b2f22}
.av.sel{opacity:1;box-shadow:0 0 0 3px #e8892b}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.aved{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.avbig{width:112px;height:112px;box-shadow:0 0 0 3px #3b2f22;background:#bfe3ff;flex:none}
.avopts{display:flex;flex-direction:column;gap:6px;flex:1;min-width:240px}
.avrow{display:flex;align-items:center;gap:10px}
.avrow>span:first-child{width:4.5em;flex:none;font-weight:700}
.sw{width:32px;height:32px;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 2px #3b2f22;opacity:.6}
.sw.sel{opacity:1;box-shadow:0 0 0 3px #e8892b;transform:scale(1.1)}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px;padding:6px 2px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:12px;height:100%}
.bar i{display:block;width:100%;background:#6aa84f;min-height:2px}
.ptable{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.ptable td,.ptable th{border-bottom:1px solid #eee;padding:4px;text-align:left}
.mist{font-size:15px;padding:4px 2px;border-bottom:1px dashed #ddd}
.gate{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10}
.gbox{background:#ece6d9;color:#2b2b2b;padding:20px 26px;box-shadow:0 0 0 4px #3b2f22;text-align:center}
.dots{font-size:36px;letter-spacing:12px;margin:8px 0 12px;min-height:44px}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.keys .pbtn{font-size:26px;height:60px}

/* 小汪 */
.dog{position:relative;width:var(--dw,96px);height:var(--dw,96px);flex:none;cursor:pointer;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
.dog img{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.dog .d0,.dog img.acc{opacity:1}
.dog.talk .d0{animation:mouthA .36s steps(1) infinite}
.dog.talk .d1{animation:mouthB .36s steps(1) infinite}
.dog.happy .d0{opacity:0}.dog.happy .d2{opacity:1}
.dog.happy{animation:bob .45s ease-in-out infinite}
.dog.sad{animation:tilt 1s ease-in-out 2}
@keyframes mouthA{0%{opacity:1}50%{opacity:0}}
@keyframes mouthB{0%{opacity:0}50%{opacity:1}}
@keyframes tilt{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.dogsay{position:relative;background:#fff;color:#2b2b2b;font-weight:900;font-size:clamp(17px,2.2vw,24px);padding:8px 16px;box-shadow:0 0 0 3px #1e1e1e,5px 5px 0 rgba(0,0,0,.25);max-width:min(60vw,560px);text-shadow:none}
.mapdog{display:flex;align-items:center;gap:14px;justify-content:center;padding:6px 16px 0;flex:none;--dw:clamp(70px,9vw,96px)}
.qrow{display:flex;align-items:center;justify-content:center;gap:16px;flex:none;--dw:clamp(64px,8vw,92px);padding:0 12px}
.qrow .qcard{margin:0}
.answers.wait{opacity:.3;pointer-events:none;filter:grayscale(.6)}
.hifive{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:8;cursor:pointer}
.hfbox{background:#fff;color:#2b2b2b;padding:20px 34px;box-shadow:0 0 0 5px #1e1e1e,8px 8px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .35s}
.hfbox img{width:clamp(110px,16vw,170px);height:clamp(110px,16vw,170px)}
.paw{width:clamp(64px,9vw,96px);height:clamp(64px,9vw,96px);animation:pulse .8s ease-in-out infinite}
.hft{font-size:clamp(24px,3.4vw,38px);font-weight:900}
.hifive.clap .paw{animation:pop .3s;transform:scale(1.3)}

/* 星星商店 */
.shop{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 24px}
.shead{font-weight:900;font-size:clamp(20px,2.8vw,28px);text-shadow:2px 2px 0 #000;margin:14px 0 8px}
.sgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.shopi{border:0;font:inherit;color:#fff;cursor:pointer;background:rgba(0,0,0,.35);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:0 0 0 3px #1e1e1e,inset 0 -6px 0 rgba(0,0,0,.3);font-weight:900}
.shopi.sel{box-shadow:0 0 0 4px #ffe14d,inset 0 -6px 0 rgba(0,0,0,.3);animation:pulse 1s ease-in-out infinite}
.shopi.use{background:rgba(76,175,80,.55)}
.sicon{width:72px;height:72px;display:flex;align-items:center;justify-content:center}
.sicon>.blk,.sicon>img{width:64px;height:64px;box-shadow:0 0 0 2px #1e1e1e}
.pv{position:relative;width:64px;height:64px;display:block}
.pv img{position:absolute;inset:0;width:100%;height:100%}
.sname{font-size:18px;text-shadow:2px 2px 0 #000}
.sprice{font-size:17px;color:#ffe14d;text-shadow:2px 2px 0 #000}
/* 秘密圖案 */
.lockbox{background:#2f3a52;padding:22px 28px;box-shadow:0 0 0 4px #1e1e1e;display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .3s}
.lockgrid{display:grid;grid-template-columns:repeat(3,auto);gap:14px}
.lockbtn{font-size:clamp(48px,7vw,70px);width:clamp(84px,11vw,110px);height:clamp(84px,11vw,110px);border:0;background:#f3ead7;cursor:pointer;box-shadow:0 0 0 3px #1e1e1e}
.kid .klock{position:absolute;top:8px;left:10px;font-size:22px}
.pbtn.sel{outline:3px solid #e8892b}

/* 拖曳加法 */
.build{display:flex;align-items:center;gap:clamp(10px,2.5vw,30px);--b:min(8vw,6.5vh,70px)}
.bzone{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(0,0,0,.25);padding:10px 14px;box-shadow:0 0 0 3px #1e1e1e}
.bzone.over{outline:5px solid #ffe14d}
.bzn{font-size:calc(var(--b)*.8);font-weight:900;text-shadow:3px 3px 0 #000;line-height:1}
.bz-area{display:grid;gap:4px}
.slot{width:var(--b);height:var(--b);outline:3px dashed rgba(255,255,255,.75);outline-offset:-6px;background:rgba(255,255,255,.12)}
.slot.full{outline:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.22);animation:pop .25s;cursor:pointer}
.src{width:calc(var(--b)*1.25);height:calc(var(--b)*1.25);margin-top:6px;box-shadow:0 0 0 3px #1e1e1e,0 6px 0 rgba(0,0,0,.35);touch-action:none;cursor:grab;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.55);animation:bob 1.6s ease-in-out infinite}
.ghost{position:fixed;left:0;top:0;width:var(--gb);height:var(--gb);pointer-events:none;z-index:20;transform:translate(-50%,-50%) scale(1.1);
  box-shadow:0 0 0 3px #1e1e1e,0 10px 20px rgba(0,0,0,.4);background-size:100% 100%;image-rendering:pixelated}

/* 每日任務 */
.questbar{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px 0;font-weight:900;font-size:clamp(16px,2.2vw,24px);text-shadow:2px 2px 0 #000;flex:none}
.qi{background:rgba(0,0,0,.35);padding:3px 12px;box-shadow:0 0 0 2px #1e1e1e}
.qi.done{background:#4caf50}
.flag{position:absolute;top:10px;padding:4px 12px;font-size:clamp(14px,1.8vw,18px);font-weight:900;box-shadow:0 0 0 3px #1e1e1e;text-shadow:1px 1px 0 #000;z-index:1}
.flag.todo{left:10px;background:#e8692b;animation:pulse 1.2s ease-in-out infinite}
.flag.did{left:10px;background:#4caf50}
.flag.rest{right:10px;background:rgba(0,0,0,.7)}
.biome.todo{box-shadow:0 0 0 4px #1e1e1e,0 0 0 8px #ffd83a,inset 0 -10px 0 rgba(0,0,0,.25)}
.biome.rest{filter:grayscale(.7) brightness(.75)}
/* 注音：照課本排法，符號直排在字的右邊；二三四聲在最後一個符號的右上，輕聲點在最上面 */
.zc{display:inline-flex;align-items:center;white-space:nowrap}
.zp{display:inline-flex;flex-direction:column;align-items:center;font-size:max(.3em,10px);line-height:1.05;margin:0 .45em 0 .1em;font-weight:700;letter-spacing:0;
  text-shadow:1px 1px 0 rgba(0,0,0,.55);font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
.zs{position:relative;display:block}
.zt{position:absolute;left:100%;top:-.15em;margin-left:.05em}
.zn{display:block;line-height:.55}
/* 淺色底上的深色字，注音不要加陰影，不然會有重影 */
.bubble .zp,.dogsay .zp,.dollwrap .zp,.card2 .zp,.dopt .zp,.pcard .zp,.lock .zp,.dside .zp{text-shadow:none}
.dtabs .btn .zp{text-shadow:1px 1px 0 rgba(0,0,0,.4)}
/* 說說看 */
.mic{font-size:clamp(28px,4vw,44px);padding:.3em 1.2em;background:#e8692b}
.mic.on{background:#c62828;animation:pulse 1s infinite}
.heard{font-size:clamp(18px,2.4vw,26px);font-weight:900;text-shadow:2px 2px 0 #000;min-height:1.4em;text-align:center}
.askline{font-family:"Avenir Next","Trebuchet MS",sans-serif}

/* 注音、英文 */
.ans.emo{font-size:clamp(44px,7vw,80px);background:#f3ead7;text-shadow:none}
.ans.zy{font-size:clamp(40px,6vw,70px);letter-spacing:.05em}
/* 拼音選項照課本直寫，聲調放在最後一個符號的右邊 */
.ans.zy .zv{display:inline-flex;flex-direction:column;align-items:center;line-height:1.02;position:relative;font-size:.72em;letter-spacing:0;vertical-align:middle}
.ans.zy .zv i{font-style:normal}
.ans.zy .zv .tn{position:absolute;right:-.6em;bottom:.15em;font-size:.8em;font-weight:inherit}
.ans.word{font-size:clamp(30px,4.6vw,54px);text-transform:none}
.listen{font-size:clamp(70px,12vw,140px);animation:bob 2s ease-in-out infinite}
.bigemo{font-size:clamp(90px,15vw,170px);line-height:1;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.35))}
.qtext.en{font-family:"Avenir Next","Trebuchet MS",sans-serif;letter-spacing:.12em}
.tip{display:flex;align-items:center;gap:24px;background:rgba(0,0,0,.45);padding:12px 30px;box-shadow:0 0 0 4px #1e1e1e;font-weight:900;font-size:clamp(28px,4.4vw,52px);text-shadow:3px 3px 0 #000}
.tip .emo{font-size:1.6em;text-shadow:none}
.tip .zyb{color:#ffe14d;font-size:1.3em}
.tones{display:grid;grid-template-columns:repeat(4,auto);gap:10px 26px;background:rgba(0,0,0,.45);padding:14px 26px;box-shadow:0 0 0 4px #1e1e1e;font-weight:900;font-size:clamp(20px,3vw,34px);text-shadow:2px 2px 0 #000;text-align:center}
.tones b{font-size:1.5em;color:#ffe14d}
.recgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin:8px 0}
.recgrid .pbtn{font-size:22px;padding:6px 0}
.recgrid .pbtn.has{background:#6aa84f;color:#fff}
.recgrid .pbtn.sel{outline:3px solid #e8892b;outline-offset:2px}

/* 專注力礦洞 */
.cavegrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr auto;gap:18px;padding:18px 24px 20px;min-height:0}

/* 寵物、釣魚池 */

@keyframes wave{to{background-position:60px 0,0 0}}

.dock::after{content:"";position:absolute;left:12%;right:12%;top:100%;height:120%;background:repeating-linear-gradient(90deg,#5a3f22 0 10px,transparent 10px 60px)}

.fbob{position:absolute;width:3.2%;aspect-ratio:1;margin:-1.6% 0 0 -1.6%;border-radius:50%;background:linear-gradient(#e33 50%,#fff 50%);box-shadow:0 0 0 2px #1e1e1e}

@keyframes dip{50%{transform:translateY(40%)}}
.fbub{position:absolute;left:8%;top:12%;background:#fff;color:#1e1e1e;font-weight:900;font-size:clamp(22px,4vw,36px);padding:0 .4em;border-radius:12px;box-shadow:0 0 0 3px #1e1e1e;display:none}

.ffish{position:absolute;width:15%;margin-left:-7.5%;z-index:3;touch-action:none;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3))}

@keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.fhearts{position:absolute;left:24%;top:30%;font-size:clamp(24px,4vw,40px);animation:heartup 1.4s forwards;pointer-events:none}
.fctl{min-height:76px;display:flex;align-items:center;justify-content:center}
.pondwrap{touch-action:none;-webkit-user-select:none;user-select:none}
.holdbtn{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;align-items:center;gap:6px}

.card.done.mine{box-shadow:0 0 0 5px #ffe14d}
.card.done.theirs{box-shadow:0 0 0 5px #5ea8ff}
.fgame{border:0;font:inherit;color:#fff;cursor:pointer;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 0 0 4px #1e1e1e,inset 0 -8px 0 rgba(0,0,0,.35)}
.fgame:active{transform:translateY(3px)}
.ficon{display:flex;gap:10px;align-items:center;height:clamp(60px,12vh,110px)}
.ficon>img,.ficon>.blk{height:100%;width:auto;aspect-ratio:1;box-shadow:0 0 0 3px #1e1e1e}
.mini{display:grid;gap:2px;height:100%;aspect-ratio:1}
.mini i{width:100%;height:100%}
.mini .lit{filter:brightness(1.8)}
.cap{font-size:clamp(22px,3.4vw,38px);font-weight:900;text-shadow:3px 3px 0 #000;background:rgba(0,0,0,.4);padding:6px 20px;box-shadow:0 0 0 3px #1e1e1e}
.farea{flex:1;display:flex;align-items:center;justify-content:center;gap:28px;min-height:0;padding:8px 16px 20px}
.mgrid{display:grid;gap:12px}
.card{width:var(--cw);height:var(--cw);border:0;padding:0;position:relative;cursor:pointer;background:none;box-shadow:0 0 0 3px #1e1e1e}
.card .back,.card .front{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card .back{font-size:calc(var(--cw)*.45);font-weight:900;color:#ffe9b0;text-shadow:3px 3px 0 #000}
.card .front{background:#f3ead7;display:none}
.card.open .front{display:flex}.card.open .back{display:none}
.card .front>*{width:70%;height:70%}
.card.flip{animation:flip .25s}
.card.done{box-shadow:0 0 0 5px #4caf50}
.sgrid{display:grid;gap:14px}
.tile{width:var(--tw);height:var(--tw);border:0;cursor:pointer;box-shadow:0 0 0 4px #1e1e1e,inset 0 0 0 4px rgba(0,0,0,.25);transition:transform .1s,filter .1s}
.tile.lit{filter:brightness(1.8) saturate(1.4);transform:scale(1.08);box-shadow:0 0 0 5px #fff,0 0 36px 8px rgba(255,255,255,.8)}
.tile.guide{outline:6px dashed #ffe14d;outline-offset:5px}
.demo{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center}
.demo>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:clamp(22px,3vw,34px);font-weight:900;text-shadow:2px 2px 0 #000}
.demo img{width:clamp(90px,14vw,150px);height:clamp(90px,14vw,150px);box-shadow:0 0 0 4px #1e1e1e}
.okc{color:#7dff8a}.ngc{color:#ff8a8a}
.holes{display:grid;gap:clamp(14px,3vw,36px)}
.hole{width:var(--hw);height:var(--hw);position:relative;box-shadow:0 0 0 4px #1e1e1e;cursor:pointer}
.pit{position:absolute;left:12%;right:12%;top:20%;bottom:8%;background:#1a120a;overflow:hidden;box-shadow:inset 0 8px 0 rgba(0,0,0,.6)}
.crt{position:absolute;left:5%;width:90%;height:90%;bottom:0;transform:translateY(110%);transition:transform .15s}
.crt.up{transform:translateY(5%)}
.maze{display:grid;touch-action:none;box-shadow:0 0 0 4px #1e1e1e}
.mc{width:var(--mc);height:var(--mc);position:relative}
.mc.seen::after{content:"";position:absolute;inset:32%;background:rgba(255,236,150,.8)}
.mc.hp::after{content:"";position:absolute;inset:22%;background:#ffe14d;box-shadow:0 0 10px #fff;animation:pulse .8s infinite}
.mc>img{position:absolute;inset:4%;width:92%;height:92%;z-index:1}
.pad{display:grid;grid-template-columns:repeat(3,clamp(56px,7vw,80px));grid-template-rows:repeat(3,clamp(56px,7vw,80px));gap:6px}
.pad .btn{padding:0;font-size:clamp(26px,3.6vw,40px);display:flex;align-items:center;justify-content:center}
@media (orientation:portrait){.farea:has(.maze){flex-direction:column}}

.shake{animation:shake .4s}
@keyframes flip{50%{transform:scaleX(0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes drift{to{transform:translateX(calc(100vw + 440px))}}
@keyframes tw{50%{opacity:.2}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

let AC = null;

      g.gain.setValueAtTime(vol, t + i * dur);
      g.gain.exponentialRampToValueAtTime(.001, t + (i + 1) * dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t + i * dur); o.stop(t + (i + 1) * dur);
    });
  } catch (e) {}
}

/* ---------- 小汪的聲音：事先產生好的音檔（voice-pack.json），沒有的片段才用裝置語音 ---------- */
const VOICE = new Map();
let VOICE_MAX = 0;
async function loadVoicePack() {
  if (!location.protocol.startsWith('http')) return;
  try {
    const r = await fetch('voice-pack.json');
    if (!r.ok) return;
    const d = await r.json();
    Object.entries(d.items || {}).forEach(([t, it]) => { VOICE.set(t, URL.createObjectURL(b64ToBlob(it.data, it.type))); VOICE_MAX = Math.max(VOICE_MAX, t.length); });
  } catch (e) {}
}
// 切法要跟 tools/voice-lines.js 一樣：用標點切開；片段裡由長到短找有音檔的詞，找不到的字交給裝置語音
const VOICE_PUNCT = /[，。！？、：；,.!?:;…～~（）()「」『』\s—–\-]+/;
function voiceSplit(p) {
  if (p.en || p.sym) return [p];
  const out = [], push = x => out.push({ ...p, ...x });
  // 句子裡的英文（例如 T-Shirt）用英文的聲音念
  p.text.split(/([A-Za-z][A-Za-z'\-]*(?: [A-Za-z][A-Za-z'\-]*)*)/).forEach((chunk, k) => {
    if (k % 2) return push({ text: chunk, en: true });
    if (!/[^\s，。！？、：；,.!?:;…～~（）()「」『』—–\-]/.test(chunk)) return;
    if (!VOICE.size) return push({ text: chunk });
    for (const s of chunk.split(VOICE_PUNCT)) {
      if (!s) continue;
      if (!/^[一-鿿0-9]+$/.test(s)) { push({ text: s }); continue; }
      let buf = '';
      for (let i = 0; i < s.length;) {
        let L = Math.min(VOICE_MAX, s.length - i);
        // 單一個字只在整段就是這個字或是數字時才用音檔，避免把名字拆開來念
        for (; L > 0; L--) { const w = s.substr(i, L); if (VOICE.has(w) && (L > 1 || s.length === 1 || /\d/.test(w))) break; }
        if (!L) { buf += s[i++]; continue; }
        if (buf) { push({ text: buf }); buf = ''; }
        push({ clip: VOICE.get(s.substr(i, L)) }); i += L;
      }
      if (buf) push({ text: buf });
    }
  });
  return out.length ? out : [p];
}

function sayParts(parts, onDone) {
  stopVoice();

  parts = parts.flatMap(voiceSplit);
  sayBusy = true;
  const next = i => {
    if (tok !== sayTok) return;
    if (i >= parts.length) {
      sayBusy = false; if (onDone) onDone();
      const more = sayAfter.shift(); if (more && tok === sayTok) sayParts(more);
      return;
    }
    const p = parts[i];
    let fired = false;
    const done = () => { if (!fired) { fired = true; next(i + 1); } };
    const rec = p.clip || (p.sym && (REC.get(p.sym) || SITEREC.get(p.sym)));
    if (rec) {
      // 共用同一個 Audio：iPad 一直開新的 Audio 會越來越卡
      const a = curAudio = VA;
      a.onended = a.onerror = a.onloadedmetadata = null; a.src = rec;
      // 家長後台的語速也套用在音檔上（預設 0.85 就是原速）
      a.defaultPlaybackRate = a.playbackRate = p.clip ? Math.min(1.3, Math.max(.7, ((S.data && S.data.voiceRate) || .85) / .85)) : 1;
      a.onended = done; a.onerror = done; a.play().catch(done);
      a.onloadedmetadata = () => setTimeout(done, a.duration * 1000 / a.playbackRate + 600);
      setTimeout(done, p.clip ? 12000 : 3000);
      return;
    }
    const text = p.sym ? ZY[p.sym][0] : p.text;
    try {
      const u = utter(text, p.en, p.rate);
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
    } catch (e) { return done(); }
    // iPad 偶爾不觸發 onend，用時間保底
    setTimeout(done, 900 + text.length * (p.en ? 120 : 320) / (p.rate || 1));
  };
  next(0);
}

function opts(ans, lo, hi, spread = 3, n = 4, extra = []) {
  const s = new Set([ans]);
  extra.forEach(v => { if (v >= lo && v <= hi && s.size < n) s.add(v); });
  for (let t = 0; s.size < n && t < 300; t++) { const v = ans + ri(-spread, spread); if (v >= lo && v <= hi) s.add(v); }
  for (let v = lo; s.size < n && v <= hi; v++) s.add(v);
  return shuffle([...s]);
}
function grid(n, tex, perRow, labels, start = 1, tex2 = null, split = 0) {
  let h = `<div class="bgrid" style="grid-template-columns:repeat(${Math.min(n, perRow)},var(--b))">`;
  for (let i = 0; i < n; i++) {
    const t = tex2 && i >= split ? tex2 : tex;
    h += `<i class="blk b t-${t}">${labels ? `<b style="animation-delay:${i * .12}s">${start + i}</b>` : ''}</i>`;
  }
  return h + '</div>';
}
function rods(n) {
  const t = Math.floor(n / 10), o = n % 10;
  let h = '<div class="rods">';
  for (let i = 0; i < t; i++) h += '<div class="rod">' + '<i class="blk s t-planks"></i>'.repeat(10) + '</div>';
  return h + '<div class="ones">' + '<i class="blk s t-grass"></i>'.repeat(o) + '</div></div>';
}
const buildVis = (a, b) => `<div class="build">${[[a, 'grass'], [b, 'planks']].map(([n, t], z) => `${z ? '<span class="op">+</span>' : ''}
  <div class="bzone" data-z="${z}"><div class="bzn">${n}</div>
    <div class="bz-area" style="grid-template-columns:repeat(${Math.min(n, 5)},var(--b))">${'<i class="slot"></i>'.repeat(n)}</div>
    <div class="src blk t-${t}" data-src="${z}">👆</div></div>`).join('')}</div>`;
// 拖曳：按住下方的方塊拖到上面的格子裡
function setupBuild() {
  const g = S.game, area = document.querySelector('.build');
  g.bc = [0, 0];
  if (!area) return;
  let ghost = null, from = -1;
  const zoneAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.bzone'); };
  const move = e => {
    if (!ghost) return;
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const z = zoneAt(e.clientX, e.clientY);
    document.querySelectorAll('.bzone').forEach(x => x.classList.toggle('over', x === z));
  };
  const up = e => {
    if (!ghost) return;
    ghost.remove(); ghost = null;
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    document.querySelectorAll('.bzone').forEach(x => x.classList.remove('over'));
    const z = zoneAt(e.clientX, e.clientY);
    if (z && S.game === g) dropBlock(from, +z.dataset.z);
  };
  area.querySelectorAll('.src').forEach(s => s.addEventListener('pointerdown', e => {
    if (S.game !== g || g.state !== 'asking') return;
    e.preventDefault();
    from = +s.dataset.src;
    ghost = document.createElement('div');
    ghost.className = 'ghost blk t-' + (from ? 'planks' : 'grass');
    ghost.style.setProperty('--gb', s.getBoundingClientRect().width + 'px');
    document.body.appendChild(ghost); move(e);
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }));
}
function dropBlock(from, to) {
  const g = S.game, need = [g.q.build.a, g.q.build.b];
  if (from !== to) { SFX.no(); bubble(from ? '木頭方塊放右邊喔' : '草地方塊放左邊喔'); return; }
  if (g.bc[to] >= need[to]) { SFX.no(); bubble('這邊已經夠了！'); return; }
  const slot = document.querySelector(`.bzone[data-z="${to}"] .slot:not(.full)`);
  slot.className = `slot full blk b t-${to ? 'planks' : 'grass'}`;
  slot.dataset.act = 'unplace'; slot.dataset.v = to;
  g.bc[to]++; SFX.tap(); speak(String(g.bc[to]));
  if (g.bc[0] === need[0] && g.bc[1] === need[1]) {
    g.building = false; refreshLock();
    dogSay([{ text: '都放好了！現在數數看，一共有幾個方塊？' }]);
  }
}
// 點一下放錯的方塊可以拿掉
function unplace(el) {
  const g = S.game;
  if (!g || !g.q.build || g.state !== 'asking') return;
  el.className = 'slot'; el.innerHTML = ''; delete el.dataset.act;
  g.bc[+el.dataset.v]--; g.building = true; refreshLock();
}

    }

      return { say: `${a} 加 ${b} 等於多少？`, display: `${a} + ${b} = ?`, visual: '', answer: a + b, options: opts(a + b, 0, 100, 2, 4, [a + b + 10, a + b - 10]),
        hint: `<div class="steps">${zy(`先加十位：${ta} + ${tb} = ${ta + tb}`)}<br>${zy(`再加個位：${a % 10} + ${b % 10} = ${a % 10 + b % 10}`)}<br>${zy(`合起來：${ta + tb} + ${a % 10 + b % 10} = ?`)}</div>` };
    }

      return { say: `${a} 減 ${b} 等於多少？`, display: `${a} − ${b} = ?`, visual: '', answer: a - b, options: opts(a - b, 0, 100, 2, 4, [a - b + 10, a - b - 10]),
        hint: `<div class="steps">${zy(`先減十位：${a} − ${tb} = ${a - tb}`)}<br>${zy(`再減個位：${a - tb} − ${b % 10} = ?`)}</div>` };

    }

// 每座建築各材料的格子（從下往上），以及每一格要放哪種材料
BUILDS.forEach(b => {
  b.order = { wood: [], stone: [], sand: [], glass: [] }; b.mat = {};
  for (let r = b.plan.length - 1; r >= 0; r--) for (let c = 0; c < 12; c++) { const ch = b.plan[r][c]; if (HMAT[ch]) { b.order[HMAT[ch]].push(r * 12 + c); b.mat[r * 12 + c] = HMAT[ch]; } }
  b.cells = Object.keys(b.mat).map(Number);
});
// 孩子自己把材料拖到格子上蓋（c.placed[建築編號] = 已放好的格子）；收集到但還沒放上去的就是手上的材料
function buildState(c) {
  const used = { wood: 0, stone: 0, sand: 0, glass: 0 };
  let cur = BUILDS.length;
  BUILDS.forEach((b, i) => {
    const p = c.placed[i] || [];
    p.forEach(cell => used[b.mat[cell]]++);
    if (cur === BUILDS.length && p.length < b.cells.length) cur = i;
  });
  const have = {};
  MATS.forEach(([m]) => have[m] = Math.max(0, c[m] - used[m]));
  return { cur, have };
}
// 舊版是材料夠了自動蓋：第一次換到新版時，把當時已經蓋好的格子記成「已放上」，孩子的房子不會不見
function legacyPlaced(c) {
  const placed = {}, used = { wood: 0, stone: 0, sand: 0, glass: 0 };
  for (let i = 0; i < BUILDS.length; i++) {
    const b = BUILDS[i], have = {};
    MATS.forEach(([m]) => have[m] = Math.max(0, (c[m] || 0) - used[m]));
    const done = MATS.every(([m]) => have[m] >= b.order[m].length);
    placed[i] = done ? b.cells.slice() : MATS.flatMap(([m]) => b.order[m].slice(0, Math.min(have[m], b.order[m].length)));
    if (!done) break;
    MATS.forEach(([m]) => used[m] += b.order[m].length);
  }
  return placed;
}

function canPlace(c) {
  const st = buildState(c), b = BUILDS[st.cur];
  if (!b) return false;
  const p = new Set(c.placed[st.cur] || []);
  return b.cells.some(cell => !p.has(cell) && st.have[b.mat[cell]] > 0);
}

// 點選題和口說題共用：答對、第 1 次錯再試、第 2 次錯給提示、第 3 次錯公布答案
function judge(ok, el, v) {
  const g = S.game, c = S.child, q = g.q;
  g.attempts++;
  if (ok) {
    g.state = 'done'; SFX.ok(); el.classList.add('good');
    const first = g.attempts === 1;
    c.totalCorrect++;
    if (first) { c.stars++; U(c).stars++; g.starsEarned++; g.correctFirst++; }
    const praise = first ? pick(['答對了！', '好厲害！', '太棒了！', '完全正確！']) : pick(['答對了！你沒有放棄，好棒！', '對了！越來越厲害！']);
    bubble(first ? praise + ' +1 ⭐' : praise); speak(praise); setDog('happy');
    logQ(first); adapt(first ? 'first' : 'ok');
    later(() => hiFive(() => { g.idx++; nextQ(); }), 900);
  } else {
    SFX.no(); g.wrong.push(v);
    if (!q.speak) el.classList.add('off');
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    if (g.attempts === 1) { bubble(q.speak ? '再說一次看看！' : '再想想看喔！'); dogSay([{ text: q.speak ? '沒關係，再說一次看看！' : '沒關係，小汪陪你再想想看！' }], null, 'sad'); }
    else if (g.attempts === 2) { showHint(); bubble('一起看提示 💡'); dogSay([{ text: '別擔心，我們一起看提示！' }, ...(q.hintParts || [])], null, 'sad'); }
    else {
      g.state = 'done';
      document.querySelectorAll('.ans').forEach(b => { if (q.options[+b.dataset.v] === q.answer) { b.classList.remove('off'); b.classList.add('reveal'); } });
      bubble(q.speak ? '很棒的嘗試！👍' : `答案是 ${q.ansLabel || q.answer}`, 2400);
      dogSay(q.revealParts || [{ text: '答案是' }, ...(q.ansParts || [{ text: String(q.answer) }]), { text: '，下次一定可以！' }]);
      logQ(false); adapt('fail');
      later(() => { g.idx++; nextQ(); }, 2800);
    }
  }
  updateHud(); save();
}

// placed 為空代表整座都已蓋好（小島上的縮圖）；否則沒放的格子顯示成虛線，裡面淡淡顯示要放的材料

function renderHouse(opt = {}) {

// 依剩下的空間縮放正在蓋的房子，避免跟材料疊在一起（直向、橫向都適用）
function fitHouse() {
  const row = document.querySelector('.hrow'), h = row && row.querySelector(':scope > .house');
  if (!h) return;
  h.style.removeProperty('--hb');
  const pal = row.querySelector('.hpal'), town = row.querySelector('.town'), land = innerWidth > innerHeight;
  const rows = Math.ceil(h.children.length / 12), gap = 28;
  const H = row.clientHeight - (land ? 0 : pal.offsetHeight + 12) - 8;
  const W = row.clientWidth - (land ? pal.offsetWidth + gap : 0) - (town ? town.offsetWidth + gap : 0) - 8;
  const now = h.offsetWidth / 12, fit = Math.floor(Math.min(now, H / rows, W / 12));
  if (fit < now) h.style.setProperty('--hb', fit + 'px');
}
window.addEventListener('resize', () => { if (S.screen === 'house') fitHouse(); });
// 拖曳手上的材料到虛線格子；要放的格子會亮黃框
function setupHouseDrag() {
  const c = S.child;
  let ghost = null, m = '';
  // 放得不準也沒關係：手指附近（大約一格半內）有要放這種材料的空格，就吸過去
  const slotAt = (x, y) => {
    let best = null, bd = Infinity;
    document.querySelectorAll(`.hc.need[data-m="${m}"]`).forEach(s => {
      const r = s.getBoundingClientRect(), d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
      if (d < r.width * 1.6 && d < bd) { bd = d; best = s; }
    });
    if (best) return best;
    const el = document.elementFromPoint(x, y); return el && el.closest('.hc.need');
  };
  const move = e => {
    if (!ghost) return;
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const s = slotAt(e.clientX, e.clientY);
    document.querySelectorAll('.hc.need').forEach(x => x.classList.toggle('over', x === s));
  };
  const up = e => {
    if (!ghost) return;
    ghost.remove(); ghost = null;
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    document.querySelectorAll('.hc.need').forEach(x => x.classList.remove('want', 'over'));
    const s = slotAt(e.clientX, e.clientY);
    if (s && S.screen === 'house') placeBlock(s, m);
  };
  document.querySelectorAll('.hsrc').forEach(src => src.addEventListener('pointerdown', e => {
    const mm = src.dataset.m, mat = MATS.find(x => x[0] === mm);
    if (!buildState(c).have[mm]) { speak(`${mat[1]}用完了，去${mat[2]}收集吧！`); return; }
    e.preventDefault(); m = mm;
    ghost = document.createElement('div');
    ghost.className = 'ghost blk t-' + mat[3];
    ghost.style.setProperty('--gb', '56px');
    document.body.appendChild(ghost); move(e);
    document.querySelectorAll(`.hc.need[data-m="${mm}"]`).forEach(x => x.classList.add('want'));
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }));
}
function placeBlock(slot, m) {
  const c = S.child, bi = buildState(c).cur;
  if (slot.dataset.m !== m) { SFX.no(); speak(`這一格要放${MATS.find(x => x[0] === slot.dataset.m)[1]}喔！`); return; }
  (c.placed[bi] = c.placed[bi] || []).push(+slot.dataset.cell);
  S.lastCell = +slot.dataset.cell; save(); SFX.tap();
  const built = buildState(c).cur > bi ? BUILDS[bi] : null;
  renderHouse({ quiet: true, built });
}

const FACES = ['t-grass', 't-planks', 't-sand', 't-gold', 't-deep', 't-log', 't-snow', 's-star', 's-sun', 's-moon', 's-heart', 's-pig', 's-mon'];
const faceHTML = f => f[0] === 't' ? `<i class="blk ${f}"></i>` : `<img class="px" src="${SPR[f.slice(2)]}">`;
function startMemory() {
  const L = flv('memory'), pairs = [3, 4, 6, 8, 10][L - 1], cols = [3, 4, 4, 4, 5][L - 1], rows = pairs * 2 / cols;
  const faces = shuffle(FACES.slice()).slice(0, pairs);
  const cards = shuffle([...faces, ...faces]).map(f => ({ f, open: false, done: false }));
  S.fg = { game: 'memory', L, pairs, cards, first: null, lock: false, moves: 0, matched: 0, miss: 0, freePeek: false };
  const cw = `min(calc((100vw - 80px) / ${cols} - 12px), calc((100vh - 200px) / ${rows} - 12px), 150px)`;
  focusShell('找出一樣的兩張！', true, `<div class="mgrid" style="grid-template-columns:repeat(${cols},var(--cw));--cw:${cw}">${cards.map((c, i) =>
    `<button class="card" data-act="mcard" data-v="${i}"><span class="back blk t-dirt">?</span><span class="front">${faceHTML(c.f)}</span></button>`).join('')}</div>`);
  speak(FGAMES.memory.say);

function peek(ms) {
  const g = S.fg; g.lock = true;
  document.querySelectorAll('.card').forEach(e => e.classList.add('open'));
  later(() => {
    document.querySelectorAll('.card').forEach((e, i) => e.classList.toggle('open', g.cards[i].open || g.cards[i].done));
    g.lock = false;
  }, ms);
}
function memTap(i) {
  const g = S.fg, c = g && g.cards && g.cards[i];
  if (!c || g.lock || c.open || c.done) return;
  const el = document.querySelectorAll('.card');
  c.open = true; el[i].classList.add('open', 'flip'); SFX.tap();
  if (g.first === null) { g.first = i; return; }
  const j = g.first, a = g.cards[j];
  g.first = null; g.moves++;
  if (a.f === c.f) {
    a.done = c.done = true; g.matched++; g.miss = 0;
    el[i].classList.add('done'); el[j].classList.add('done'); SFX.ok();
    bubble(pick(['一樣的！', '找到了！', '好眼力！']), 900);
    if (g.matched === g.pairs) later(() => {
      const r = g.moves / g.pairs;
      endFocus(r <= 1.5 ? 3 : r <= 2.5 ? 2 : 1, r <= 2, r > 3.5, `${g.pairs} 對，翻了 ${g.moves} 次`);
    }, 1000);
  } else {
    g.lock = true; g.miss++;
    later(() => {
      a.open = c.open = false;
      el[i].classList.remove('open', 'flip'); el[j].classList.remove('open', 'flip');
      g.lock = false;
      if (g.miss >= 4 && !g.freePeek) { g.freePeek = true; g.miss = 0; bubble('偷看一下 👀'); speak('沒關係，我們偷看一下！'); peek(1500); }
    }, 1000);
  }
}

}

function startSeq() {

function newSeq() {

/* 礦洞迷宮 */
function genMaze(n) {
  const W = 2 * n + 1, m = Array(W * W).fill(1), st = [[0, 0]], seen = new Set(['0,0']);
  m[W + 1] = 0;
  while (st.length) {
    const [x, y] = st[st.length - 1];
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy])
      .filter(([a, b]) => a >= 0 && b >= 0 && a < n && b < n && !seen.has(a + ',' + b));
    if (!nb.length) { st.pop(); continue; }
    const [a, b] = pick(nb);
    seen.add(a + ',' + b);
    m[(2 * b + 1) * W + 2 * a + 1] = 0; m[(y + b + 1) * W + x + a + 1] = 0;
    st.push([a, b]);
  }
  return { W, m };
}
function startMaze() {
  const L = flv('maze'), n = L + 3, { W, m } = genMaze(n), goal = W * W - W - 2;
  const g = S.fg = { game: 'maze', L, n, W, m, goal, pos: W + 1, hints: 0, freeHint: false, t0: Date.now(), done: false, drag: false };
  // 直向（手機、直拿的 iPad）時方向鍵放到迷宮下方，迷宮才能放大
  const tall = innerHeight > innerWidth;

      const list = v === 'zh' ? voiceList(/zh[-_]TW/i) : voiceList(/en[-_](US|GB)/i), vo = list[d];
      if (!vo) return;
      S.data[v === 'zh' ? 'zhVoice' : 'enVoice'] = vo.voiceURI; save(); pickVoice(); renderParent();
      sayParts(v === 'zh' ? [{ text: '你好，我是小汪！媽、麻、馬、罵。' }] : [{ text: 'Hello! I am your friend. Apple, ball, cat.', en: true }]);
      return;
    }
    case 'p-recsel': S.recSel = v; break;
    case 'p-lock': c.lock = v; break;
    case 'p-addchild': renderSetup(); return;
    case 'p-backup': exportBackup(); return;
    case 'p-cloudstart': cloudStart(); return;
    case 'p-cloudjoin': cloudJoin(document.getElementById('cjoin').value); return;
    case 'p-cloudnow': cloudSync().then(() => { renderParent(); alert(S.data.cloud.err ? '目前連不上雲端，請確認網路。' : '備份完成！'); }); return;
    case 'p-cloudshare': {
      const text = `學習島的家庭代碼：${S.data.cloud.code}`;
      if (navigator.share) navigator.share({ text }).catch(() => {}); else prompt('請複製家庭代碼：', S.data.cloud.code);
      return;
    }
    case 'p-cloudoff':
      if (!confirm('停止後，這台 iPad 的進度不會再自動存到雲端（雲端上已存的資料不會刪除）。確定嗎？')) return;
      S.data.cloud = { rt: S.data.cloud.rt }; saveLocal(); renderParent(); return;
    case 'p-delchild':
      if (!confirm(`確定要刪除「${c.name}」的帳號和所有進度嗎？這個動作無法復原。`)) return;
      S.data.children = S.data.children.filter(x => x !== c);
      (S.data.deleted = S.data.deleted || []).push(c.id);
      save();
      return S.data.children.length ? renderParent() : renderSetup();
    case 'p-rec': if (!S.recBusy) recordSym(v); return;
    case 'p-recplay': sayParts([{ sym: v }]); return;
    case 'p-recdel': deleteRec(v).then(renderParent); return;
    case 'p-recexport': exportRecs(); return;
    case 'p-flv': c.focus[v] = Math.max(1, Math.min(5, c.focus[v] + d)); break;
    case 'p-age': c.age = Math.max(3, Math.min(12, c.age + d)); break;
    case 'p-avatar': c.avatar = { ...avObj(c.avatar), [v]: d, outfit: 0 }; break; // 改像素頭像時就脫下特別造型（在商店可以再穿上）
    case 'p-limit': c.limit = Math.max(5, Math.min(120, c.limit + d)); break;
    case 'p-extra': u.extra += d; break;
    case 'p-resettoday': u.sec = 0; u.extra = 0; break;
    case 'p-endtoday': u.sec = (c.limit + u.extra) * 60; break;
    case 'p-level': p.level = Math.max(1, Math.min(top, p.level + d)); p.minLevel = Math.min(p.minLevel, p.level); p.maxLevel = Math.max(p.maxLevel, p.level); break;
    case 'p-min': p.minLevel = Math.max(1, Math.min(p.maxLevel, p.minLevel + d)); p.level = Math.max(p.level, p.minLevel); break;
    case 'p-max': p.maxLevel = Math.max(p.minLevel, Math.min(top, p.maxLevel + d)); p.level = Math.min(p.level, p.maxLevel); break;
    case 'p-pin': {
      const p = prompt('輸入新的 4 位數密碼');
      if (p === null) return;
      if (!/^\d{4}$/.test(p)) { alert('請輸入 4 位數字'); return; }
      S.data.pin = p; alert('密碼已更新'); break;
    }
    case 'p-reset':
      if (!confirm('確定要清除這台 iPad 上所有孩子的進度和學習紀錄嗎？這個動作無法復原（雲端上的備份不會被刪除）。')) return;
      S.data = defaultData(); save(); return renderSetup();
  }
  // 家長改了孩子的設定，也算這個孩子的更新（雲端合併時以較新的為準）
  if (c) c.upd = Date.now();
  save(); renderParent();
}

/* ---------- 事件 ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  const a = el.dataset.act, v = el.dataset.v, d = +el.dataset.d || 0;
  const ch = el.dataset.id ? S.data.children.find(c => c.id === el.dataset.id) : null;
  if (a.startsWith('p-') && a !== 'p-name') return parentAct(a, ch, d, v);
  switch (a) {
    case 'login':
      SFX.tap();
      if (remaining(ch) <= 0) { speak(`${ch.name}，今天的時間用完囉，明天再一起玩吧！`); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return; }
      if (ch.lock) showLock(ch); else enterChild(ch);
      break;
    case 'unlock': {
      if (v === ch.lock) { document.getElementById('lock').remove(); SFX.ok(); enterChild(ch); break; }
      SFX.no(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      speak('這不是你的秘密圖案喔，再試一次！');
      break;
    }
    case 'lockclose': document.getElementById('lock').remove(); break;
    case 'shop': SFX.tap(); S.shopSel = ''; renderShop(); dogSay([{ text: `歡迎來到星星商店！你有 ${S.child.stars} 顆星星，可以換材料，也可以幫小汪換造型喔！` }]); break;
    case 'buy': shopTap(v); break;
    case 'buyok': shopBuy(v); break;
    case 'buyno': SFX.tap(); document.getElementById('shopask')?.remove(); break;
    case 'su-age': S.su.age = Math.max(3, Math.min(12, S.su.age + d)); document.getElementById('sage').textContent = S.su.age + ' 歲'; break;
    case 'su-av': S.su.avatar = { ...avObj(S.su.avatar), [v]: d }; document.querySelector('.aved').outerHTML = avatarEditor(S.su.avatar, 'su-av'); break;
    case 'su-lock': S.su.lock = v; document.querySelectorAll('[data-act="su-lock"]').forEach(x => x.classList.toggle('sel', x.dataset.v === v)); break;
    case 'su-add': {
      const name = document.getElementById('sname').value.trim().slice(0, 8);
      if (!name) { alert('請先輸入孩子的名字'); return; }
      const c = newChild(name, S.su.age, S.su.avatar);
      c.greet = document.getElementById('sgreet').value.trim().slice(0, 30); c.lock = S.su.lock;
      S.data.children.push(c); save(); renderSetup();
      break;
    }
    case 'su-done': {
      const pin = document.getElementById('spin').value.trim();
      if (!S.data.children.length) { alert('請先新增至少一個孩子'); return; }
      if (!/^\d{4}$/.test(pin)) { alert('家長密碼請輸入 4 位數字'); return; }
      S.data.pin = pin; save(); renderLogin();
      break;
    }
    case 'logout': save(); renderLogin(); break;
    case 'tomap': {
      SFX.tap(); if (remaining(S.child) <= 0) return goodbye();
      const fromRound = S.screen === 'result' || S.screen === 'cave';
      renderMap();
      // 過完一關回到地圖時，提醒今天還沒去的地方
      if (fromRound) dogSay([{ text: questLine(S.child) }]);
      break;
    }
    case 'dogtap':
      if (S.screen === 'map') dogSay([{ text: questLine(S.child) }]);
      else if (S.screen === 'game' && S.game && S.game.q) dogSay(S.game.q.replay || qParts(S.game.q));
      break;
    case 'hifive': doHiFive(true); break;
    case 'unplace': unplace(el); break;
    case 'biome': {
      const b = BIOMES.find(x => x.id === v);
      if (!b.open) { speak(`${b.name}還在建造中，快要開放囉！`); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return; }
      if (blocked(S.child, b.id)) return restHere(el);
      SFX.tap();
      if (SUBJ[b.id]) startGame(b.id, b.say); else { speak(b.say); renderCave(); }
      break;
    }
    case 'again':
      if (remaining(S.child) <= 0) return goodbye();
      if (blocked(S.child, S.lastBiome)) { renderMap(); return restHere(); }
      S.again(); break;
    case 'tocave': SFX.tap(); if (remaining(S.child) <= 0) return goodbye(); renderCave(); break;
    case 'fgame': if (blocked(S.child, 'focus')) { renderMap(); return restHere(); } SFX.tap(); startFocus(v); break;
    case 'fhint': focusHint(); break;
    case 'mcard': memTap(+v); break;
    case 'duel': if (blocked(S.child, 'focus')) { renderMap(); return restHere(); } SFX.tap(); duelOpen(); break;
    case 'duel-new': SFX.tap(); duelNew(v); break;
    case 'duel-join': SFX.tap(); duelJoin(); break;
    case 'duel-card': duelTap(+v); break;
    case 'tile': seqTap(+v); break;
    case 'rstart': runReact(); break;
    case 'hole': hitHole(+v); break;
    case 'mz': if (S.fg && S.fg.game === 'maze') mazeTo(S.fg.pos + d); break;
    case 'house': SFX.tap(); renderHouse(); break;
    case 'village': speak('家族村莊還在建造中，之後大家蓋的房子都會住在一起喔！'); break;
    case 'pond': SFX.tap(); renderPond(); if (curPet(S.child)) speak('歡迎來到釣魚池！按拋竿開始釣魚，釣到的魚答對問題就可以餵小動物！'); break;
    case 'bag': case 'petlist': SFX.tap(); renderPetList(false); break;
    case 'adopt': if (S.child.pets.length) adopt(v); else adoptAsk(v); break;
    case 'adoptok': adopt(v); break;
    case 'frame': pickFrame(+v); break;
    case 'adoptno': SFX.tap(); document.getElementById('adoptask')?.remove(); break;
    case 'pethide': S.data.petHide = true; saveLocal(); document.getElementById('petbuddy').outerHTML = petBuddy(); break;
    case 'petshow': S.data.petHide = false; saveLocal(); el.outerHTML = petBuddy(); break;
    case 'mine': SFX.tap(); renderMine(); speak('金礦山到了！金礦旁邊的石頭會閃光，看準了再放炸彈！'); break;
    case 'mbomb': mineBomb(+v); break;
    case 'doll': SFX.tap(); renderDoll('top'); speak('歡迎來到娃娃屋！點衣服和飾品，幫自己換裝吧！'); break;
    case 'dtab': SFX.tap(); renderDoll(v); break;
    case 'dh': dollSet({ [v]: d }); break;
    case 'dw': { const [slot, id] = v.split(':'); dollSet({ [slot]: id }, id ? `換上${dollItem(id).name}了！` : ''); break; }
    case 'dpic': dollSet({ outfit: +v }, +v ? `頭像換成${OUTFITS.find(x => x[0] === +v)[1]}了！` : '頭像換回我的娃娃了！'); break;
    case 'cast': cast(); break;
    case 'fok': SFX.tap(); showFishQ(); break;
    case 'fsay': if (S.fish && S.fish.q) sayParts(S.fish.q.replay || qParts(S.fish.q)); break;
    case 'fans': fishAnswer(+v, el); break;
    case 'say': dogSay(S.game.q.replay || qParts(S.game.q)); break;
    case 'ans': onAnswer(+v, el); break;
    case 'mic': onMic(el); break;
    case 'buyhint': buyHint(); break;
    case 'parent': renderGate(); break;
    case 'gateclose': document.getElementById('gate').remove(); break;
    case 'pin':
      S.pinBuf = v === 'del' ? S.pinBuf.slice(0, -1) : (S.pinBuf + v).slice(0, 4);
      document.getElementById('dots').textContent = '●'.repeat(S.pinBuf.length);
      if (S.pinBuf.length === 4) {
        if (S.pinBuf === S.data.pin) renderParent();
        else { S.pinBuf = ''; const g = document.querySelector('.gbox'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); setTimeout(() => { const dd = document.getElementById('dots'); if (dd) dd.textContent = ''; }, 300); }
      }
      break;
  }
});
app.addEventListener('change', e => {
  const el = e.target;
  const c = S.data.children.find(x => x.id === el.dataset.id);
  if (el.dataset.act === 'p-name') { c.name = el.value.trim().slice(0, 8) || c.name; save(); }
  if (el.dataset.act === 'p-greet') { c.greet = el.value.trim().slice(0, 30); save(); }
  if (el.dataset.act === 'p-restore' && el.files[0]) restoreBackup(el.files[0]);
});
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- 登入：問候語、秘密圖案、第一次使用的註冊 ---------- */
const LOCKS = [['dog', '🐶', '小狗'], ['cat', '🐱', '貓咪'], ['rabbit', '🐰', '兔子'], ['bear', '🐻', '熊熊'], ['fish', '🐟', '小魚'], ['star', '⭐', '星星']];
function enterChild(ch) {
  S.child = ch; S.warned = false; S.sunset = false; S.endPending = false;
  renderMap();
  const hi = ch.greet || `${ch.name}，歡迎回來！`;
  dogSay([{ text: hi + '我是小汪。' + (questComplete(ch) ? '今天要去哪裡冒險呢？' : '今天的任務是：四個地方都去冒險一次，就能打開寶箱喔！') }]);
  if (remaining(ch) <= 180) warnSunset();
}
// 同一台 iPad 有好幾個孩子時，點自己的秘密圖案才能進去，避免點到別人的頭像
function showLock(ch) {
  app.firstElementChild.insertAdjacentHTML('beforeend', `<div class="gate" id="lock"><div class="lockbox">
    <img class="px" src="${avatarURL(ch.avatar)}" width="84" height="84" style="box-shadow:0 0 0 3px #1e1e1e">
    <div class="hft">${zy(ch.name + '，點你的秘密圖案')}</div>
    <div class="lockgrid">${shuffle(LOCKS.slice()).map(([id, e]) => `<button class="lockbtn" data-act="unlock" data-id="${ch.id}" data-v="${id}">${e}</button>`).join('')}</div>
    <button class="btn small" data-act="lockclose">${zy('不是我')}</button></div></div>`);
  speak(`${ch.name}，請點你的秘密圖案！`);
}
// 第一次使用（或換新 iPad）時，由家長幫每個孩子建立帳號
function renderSetup() {
  S.screen = 'setup'; S.su = { age: 5, avatar: avObj(S.data.children.length), lock: '' };
  const kids = S.data.children;
  app.innerHTML = `<div class="screen parent"><div class="ptop"><span>👋 設定孩子的帳號</span>${kids.length ? '<button class="pbtn light" data-act="logout">回到首頁 ▶</button>' : ''}</div>
    <div class="pcards">
      <div class="pcard" style="grid-column:1/-1">
        <div class="pnote">先幫每個孩子建立帳號。孩子不用打字，之後點自己的頭像就能進去，每個人的星星、材料、等級和紀錄都分開。換新 iPad 的話，可以直接用舊 iPad 的「備份進度」檔案還原。</div>
        <div class="prow"><span>☁️ 用家庭代碼找回</span><span><input class="pname" id="cjoin" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" style="width:250px"> ${pb('p-cloudjoin', '', 0, '找回進度', '')}</span></div>
        <div class="prow"><span>📥 從備份檔還原</span><label class="pbtn light">選擇備份檔<input type="file" accept=".json,application/json" data-act="p-restore" hidden></label></div>
      </div>
      <div class="pcard"><h3>新增孩子</h3>
        <div class="prow"><span>名字</span><input class="pname" id="sname" placeholder="例如：小寶" maxlength="8"></div>
        <div class="prow"><span>年齡</span><span>${pb('su-age', '', -1, '−')} <b id="sage">${S.su.age} 歲</b> ${pb('su-age', '', 1, '+')}</span></div>
        <div class="prow"><span>頭像</span></div>${avatarEditor(S.su.avatar, 'su-av')}
        <div class="prow"><span>登入問候語</span><input class="pname" id="sgreet" placeholder="例如：小寶，今天也要加油喔！" maxlength="30"></div>
        <div class="pnote">問候語會在孩子登入時由小汪念出來；不填就用「名字，歡迎回來！」。</div>
        <div class="prow"><span>秘密圖案</span><span>${[['', '不用'], ...LOCKS.map(([id, e]) => [id, e])].map(([id, e]) => `<button class="pbtn light ${id === '' ? 'sel' : ''}" data-act="su-lock" data-v="${id}">${e}</button>`).join(' ')}</span></div>
        <div class="pnote">同一台 iPad 有兩個以上孩子時建議設定：孩子要點對自己的圖案才能進去。</div>
        <div class="prow">${pb('su-add', '', 0, '＋ 新增這個孩子', '')}</div>
      </div>
      <div class="pcard"><h3>已建立的孩子</h3>
        ${kids.map(c => `<div class="prow"><span><img class="px" src="${avatarURL(c.avatar)}" width="32" height="32" style="vertical-align:middle"> <b>${esc(c.name)}</b>（${c.age} 歲）</span><span>${c.lock ? '🔒 ' + LOCKS.find(l => l[0] === c.lock)[1] : ''}</span></div>`).join('') || '<div class="pnote">還沒有，請在左邊新增。</div>'}
        <div class="prow"><span>家長密碼（4 位數字）</span><input class="pname" id="spin" inputmode="numeric" maxlength="4" value="${esc(S.data.pin)}" style="width:110px"></div>
        <div class="prow">${pb('su-done', '', 0, '完成，開始玩 ▶', '')}</div>
      </div>
    </div></div>`;
}
function restHere(el) {
  speak('這裡已經連續玩兩關囉，先去別的地方冒險，等一下再回來！');
  if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
}
function warnSunset() {
  S.warned = true; S.sunset = true;
  showBanner();
  speak('太陽快下山了，再玩一下下，我們就要回家休息囉！', { queue: true });
}

/* ---------- 計時 ---------- */
setInterval(() => {
  const c = S.child;
  if (!c || !['map', 'game', 'result', 'house', 'cave', 'focus', 'shop'].includes(S.screen) || document.hidden) return;
  const u = U(c);
  u.sec++;
  if (u.sec % 5 === 0) save();
  updateHud();
  const rem = remaining(c);
  if (rem <= 180 && !S.warned) warnSunset();
  if (rem <= 0) {
    // 讓孩子把手上這題／這局做完再道別；超時 3 分鐘仍未結束就直接道別
    if (S.screen === 'game' || S.screen === 'focus') { S.endPending = true; if (rem < -180) goodbye(); }
    else if (!(S.screen === 'result' && Date.now() - S.resultAt < 6000)) goodbye();
  }
}, 1000);
document.addEventListener('visibilitychange', saveLocal);

S.data = load();
pickVoice();
initArt();
renderLogin();
loadRecs();
loadSiteRecs(); loadVoicePack();
scheduleCloud(2000);

// 放到網址上才會啟用離線快取；直接開檔案時略過
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
// 請瀏覽器不要自動清掉孩子的進度
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
