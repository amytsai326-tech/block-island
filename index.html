<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="方塊學習島">
<meta name="theme-color" content="#5fb0ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>方塊學習島</title>
<style>
:root{--b:clamp(30px,calc(4.6 * var(--vw, 1vw)),58px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;background:#7ec8ff linear-gradient(#5fb0ff,#b6e0ff) fixed;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
input{user-select:text;-webkit-user-select:text}
/* 高度用 dvh 算，不用 bottom:0：iPhone 加到主畫面（狀態列透明）時，fixed 的 bottom 會少一個狀態列的高度，下面空一大塊 */
#app{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);transform-origin:0 0;
  height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.sky{background:linear-gradient(#5fb0ff,#b6e0ff)}
.sky.sunset{background:linear-gradient(#ff8a4c,#ffb98a 55%,#ffe0b8)}
.night{background:linear-gradient(#0b1640,#28306b 70%,#3c3f86)}
.px{image-rendering:pixelated}
.blk{display:inline-block;background-size:100% 100%;image-rendering:pixelated;position:relative}
.tiled{background-size:var(--tile,64px) var(--tile,64px);image-rendering:pixelated}
.b{width:var(--b);height:var(--b);box-shadow:inset 0 0 0 2px rgba(0,0,0,.22)}
.b>b,.nb>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.48);
  color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;animation:pop .3s both}
.s{width:calc(var(--b)*.42);height:calc(var(--b)*.42)}

.btn{font:inherit;font-weight:900;color:#fff;border:0;cursor:pointer;background:#8b8b8b;padding:.45em .9em;
  text-shadow:2px 2px 0 rgba(0,0,0,.5);font-size:clamp(16px,calc(2.2 * var(--vw, 1vw)),24px);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.3),0 0 0 3px #1e1e1e}
.btn:active{transform:translateY(2px);filter:brightness(.9)}
.btn.green{background:#4caf50}.btn.blue{background:#3d7bd9}.btn.orange{background:#e8892b}
.btn.small{padding:.2em .6em}.btn.big{font-size:clamp(22px,calc(3.2 * var(--vw, 1vw)),34px)}

/* 登入 */
.login{align-items:center;justify-content:center;gap:calc(2 * var(--vh, 1vh))}
.title{font-size:clamp(36px,calc(7 * var(--vw, 1vw)),80px);font-weight:900;text-shadow:5px 5px 0 #2f4f2f;letter-spacing:.06em;z-index:1}
.title.sm{font-size:clamp(32px,calc(5 * var(--vw, 1vw)),56px)}
.sub{font-size:clamp(18px,calc(2.6 * var(--vw, 1vw)),28px);font-weight:900;text-shadow:2px 2px 0 #335;z-index:1}
.kids{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(4 * var(--vw, 1vw));z-index:1;margin-bottom:calc(14 * var(--vh, 1vh));max-width:calc(94 * var(--vw, 1vw))}
.kid{background:rgba(0,0,0,.28);border:0;padding:18px 22px 14px;color:#fff;font:inherit;font-weight:900;position:relative;cursor:pointer;
  box-shadow:0 0 0 4px #1e1e1e,inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.2);animation:bob 3s ease-in-out infinite}
.kid:nth-child(2){animation-delay:-1.5s}
.kid .face{width:clamp(110px,calc(16 * var(--vw, 1vw)),180px);height:clamp(110px,calc(16 * var(--vw, 1vw)),180px);display:block;box-shadow:0 0 0 4px #1e1e1e}
.kname{font-size:clamp(20px,calc(3 * var(--vw, 1vw)),32px);margin-top:10px;text-shadow:2px 2px 0 #000}
.kmeta{font-size:18px;opacity:.9}
.kid.sleep .face{filter:grayscale(.6) brightness(.6)}
.zzz{position:absolute;top:8px;right:12px;font-size:34px;font-weight:900;color:#cfe3ff;text-shadow:2px 2px 0 #000;animation:float 2s ease-in-out infinite}
.ground{position:absolute;left:0;right:0;bottom:0;height:calc(16 * var(--vh, 1vh));--tile:64px}
.grassrow{height:64px}.dirtrow{position:absolute;top:64px;bottom:0;left:0;right:0}
.gear{position:absolute;right:16px;bottom:16px;z-index:2;font-size:18px}
.appver{position:absolute;left:16px;bottom:22px;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100% - 150px);font-size:15px;font-weight:900;color:#fff;text-shadow:2px 2px 0 #000}
.appver .btn{font-size:16px}
.devsw{display:inline-flex;gap:6px}
.cloud{position:absolute;left:-220px;width:180px;height:44px;background:#fff;opacity:.9;animation:drift linear infinite}
.cloud::after{content:"";position:absolute;left:36px;top:-26px;width:90px;height:26px;background:#fff}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(0,0,0,.35);font-weight:900;font-size:clamp(16px,calc(2.2 * var(--vw, 1vw)),24px);flex:none}
.hface{width:44px;height:44px;box-shadow:0 0 0 3px #1e1e1e}
.hname{text-shadow:2px 2px 0 #000;white-space:nowrap}
@media (orientation:portrait){.phone .hud{gap:6px;padding:8px}.phone .pill{padding:3px 5px;gap:3px}}
.phone .mapbar.small .btn{font-size:22px;white-space:nowrap}
@media (orientation:portrait){.phone .mapbar{flex-wrap:wrap;gap:8px 10px;padding:6px 8px 12px}.phone .mapbar.small .btn{font-size:20px;padding:.3em .6em}}
.daybar{flex:1;height:18px;background:#1d2b4a;position:relative;box-shadow:0 0 0 3px #1e1e1e;margin:0 18px}
.dayfill{height:100%;background:linear-gradient(90deg,#ffd166,#ffe9a8);transition:width 1s linear}
.daybar.late .dayfill{background:linear-gradient(90deg,#ff6b2a,#ffae5c)}
.sunico{position:absolute;top:-9px;width:30px;height:30px;transition:left 1s linear}
.pill{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);padding:4px 8px;box-shadow:0 0 0 2px #1e1e1e;text-shadow:2px 2px 0 #000}
.ico{width:24px;height:24px}
.pulse{animation:pop .4s}
.banner{position:absolute;top:78px;left:50%;transform:translateX(-50%);background:#e8692b;padding:8px 22px;font-weight:900;
  font-size:clamp(18px,calc(2.4 * var(--vw, 1vw)),26px);box-shadow:0 0 0 3px #1e1e1e;z-index:6;white-space:nowrap;text-shadow:2px 2px 0 #000;animation:pop .4s}

/* 地圖 */
.mapgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr .62fr;gap:14px 18px;padding:14px 24px 8px;min-height:0}
/* 釣魚池、金礦山：不算每日任務，格子小一點 */
.biome.extra .sym{font-size:clamp(30px,calc(5 * var(--vw, 1vw)),56px)}
.biome.water{background:repeating-linear-gradient(170deg,rgba(255,255,255,.14) 0 6px,transparent 6px 26px),linear-gradient(#5ec3ff,#2a78c8)}
.biome.extra.locked::after{content:none}
.mapbar.small .btn{font-size:clamp(16px,calc(2.2 * var(--vw, 1vw)),22px);padding:.35em .9em}
@media (orientation:landscape){.mapgrid{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}}
.biome{position:relative;border:0;font:inherit;color:#fff;cursor:pointer;--tile:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;
  box-shadow:0 0 0 4px #1e1e1e,inset 0 -10px 0 rgba(0,0,0,.25)}
.biome:active{transform:translateY(3px)}
.biome .sym{font-size:clamp(40px,calc(7 * var(--vw, 1vw)),84px);font-weight:900;text-shadow:5px 5px 0 rgba(0,0,0,.55);line-height:1}
.bname{font-size:clamp(20px,calc(3 * var(--vw, 1vw)),32px);font-weight:900;background:rgba(0,0,0,.45);padding:2px 14px;text-shadow:2px 2px 0 #000}
.lv{font-size:clamp(14px,calc(1.8 * var(--vw, 1vw)),18px);font-weight:900;background:rgba(0,0,0,.4);padding:2px 10px}
.biome.locked .sym{opacity:.55}
.biome.locked::after{content:"🔒 即將開放";position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);padding:4px 10px;font-size:16px;font-weight:900}
.mapbar{display:flex;gap:16px;justify-content:center;padding:8px 0 16px;flex:none}

/* 遊戲 */
.gtop{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 6px;flex:none}
.pips{display:flex;gap:8px}
.pip{width:34px;height:34px;background:rgba(0,0,0,.3);box-shadow:0 0 0 3px #1e1e1e}
.pip.cur{outline:3px solid #ffd83a;outline-offset:3px}
.hintbtn{display:flex;align-items:center;gap:6px;background:#e8a72b}
.qcard{margin:4px auto 0;display:flex;align-items:center;gap:18px;background:rgba(0,0,0,.35);padding:8px 28px;box-shadow:0 0 0 4px #1e1e1e;flex:none}
.qtext{font-size:clamp(34px,calc(6 * var(--vw, 1vw)),72px);font-weight:900;text-shadow:4px 4px 0 #000;letter-spacing:.04em}
/* 手機橫拿：高度很少，題目字小一點，數數的方塊大一點 */
@media (orientation:landscape){.phone .qtext{font-size:46px}.phone .qcard{padding:4px 20px}
  .phone .visual [style*="--b"]{--b:min(calc(5.5 * var(--vw, 1vw)),calc(9 * var(--vh, 1vh)),70px) !important}}
.visual{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0;overflow:hidden}
.answers{display:flex;justify-content:center;gap:clamp(12px,calc(3 * var(--vw, 1vw)),36px);padding:0 16px calc(3 * var(--vh, 1vh));flex:none}
.ans{min-width:clamp(90px,calc(15 * var(--vw, 1vw)),170px);font-size:clamp(34px,calc(5.5 * var(--vw, 1vw)),64px);padding:.2em .4em;background:#3d7bd9}
.ans.off{opacity:.3;filter:grayscale(1);pointer-events:none}
.ans.good{background:#4caf50;animation:pop .4s}
.ans.reveal{background:#4caf50;animation:pulse 1s infinite}
.bubble{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#fff;color:#2b2b2b;
  font-size:clamp(28px,calc(4.5 * var(--vw, 1vw)),52px);font-weight:900;padding:14px 30px;box-shadow:0 0 0 4px #1e1e1e,8px 8px 0 rgba(0,0,0,.3);
  transition:.25s;pointer-events:none;z-index:5;white-space:nowrap;text-align:center;max-width:calc(94 * var(--vw, 1vw))}
.bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bgrid{display:grid;gap:4px}
.addv{display:flex;align-items:center;gap:20px}
.op{font-size:calc(var(--b)*1.1);font-weight:900;text-shadow:3px 3px 0 #000}
.rods{display:flex;gap:6px;align-items:flex-end}
.rod{display:flex;flex-direction:column;gap:1px}
.ones{display:grid;grid-template-columns:repeat(5,calc(var(--b)*.42));gap:1px}
.cmp{display:flex;gap:clamp(16px,calc(4 * var(--vw, 1vw)),48px);align-items:flex-end}
.cmpc{display:flex;flex-direction:column;align-items:center;gap:8px}
.cmpn{font-size:clamp(26px,calc(4 * var(--vw, 1vw)),44px);font-weight:900;text-shadow:3px 3px 0 #000}
.nline{display:flex;gap:10px}
.nb{width:calc(var(--b)*1.5);height:calc(var(--b)*1.2);box-shadow:inset 0 0 0 3px rgba(0,0,0,.3)}
.nb>b{font-size:calc(var(--b)*.55)}
.steps{background:rgba(0,0,0,.45);padding:14px 26px;font-size:clamp(22px,calc(3.4 * var(--vw, 1vw)),38px);font-weight:900;line-height:1.6;box-shadow:0 0 0 4px #1e1e1e;text-shadow:2px 2px 0 #000}
.mrows{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:3px}
.mrow span{margin-left:12px;font-size:clamp(18px,calc(2.6 * var(--vw, 1vw)),28px);font-weight:900;text-shadow:2px 2px 0 #000;min-width:2.2em}

/* 結果 / 家 / 晚安 */
.panel{margin:auto;background:rgba(0,0,0,.45);padding:26px 40px;box-shadow:0 0 0 4px #1e1e1e;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;position:relative;z-index:1}
.rewards{display:flex;gap:40px;font-size:clamp(30px,calc(4.5 * var(--vw, 1vw)),48px);font-weight:900;text-shadow:3px 3px 0 #000}
.rw{display:flex;align-items:center;gap:10px}
.rw img,.rw .blk{width:60px;height:60px}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.badge{background:#c9932a;padding:6px 16px;font-weight:900;font-size:22px;box-shadow:0 0 0 3px #1e1e1e;animation:pop .5s}
.lvup{font-size:24px;font-weight:900;color:#ffe14d;text-shadow:2px 2px 0 #000}
.house{display:grid;grid-template-columns:repeat(12,var(--hb));--hb:min(calc(12.8 * var(--vw, 1vw)),calc(11.2 * var(--vh, 1vh)));margin:0 auto}
.hrow{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:center;gap:12px 28px;align-items:center;justify-content:center;overflow:hidden;padding:0 10px}
.hrow .hpal{flex-basis:100%}
/* 橫向：材料改放在房子右邊直排，房子大小由 fitHouse() 依剩下的空間決定 */
@media (orientation:landscape){
  .hrow{flex-wrap:nowrap}
  .hrow .hpal{flex-basis:auto;flex-direction:column;flex-wrap:nowrap;gap:8px}
  .hrow .hsrc{flex-direction:row;gap:8px;padding:4px 10px}
  .hrow .hsrc .blk{width:40px;height:40px}
}
@media (orientation:landscape) and (max-height:600px){.hrow .hpal{display:grid;grid-template-columns:auto auto}}
.hcheer{text-align:center;margin:2px auto 0;font-size:clamp(16px,calc(2.2 * var(--vw, 1vw)),22px)}
.town{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:4px 10px;flex:none;max-width:calc(42 * var(--vw, 1vw))}
.tb{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.25);padding:6px 8px;box-shadow:0 0 0 3px #1e1e1e}
.house.mini{--hb:9px}
.town.big{flex:1;align-content:center;gap:18px;max-width:none;min-height:0}
.town.big .house.mini{--hb:min(calc(1.5 * var(--vw, 1vw)),calc(2.1 * var(--vh, 1vh)))}
.tname{font-weight:900;font-size:16px;text-shadow:2px 2px 0 #000;margin-top:4px}
.pet{display:inline-block;animation:bob 1.6s ease-in-out infinite;font-size:1.3em}
.hc{width:var(--hb);height:var(--hb)}
.hc.need{outline:2px dashed rgba(255,255,255,.7);outline-offset:-4px;background:rgba(255,255,255,.12);position:relative}
.hc.need .gt{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.hc.want{outline:3px dashed #ffe14d;background:rgba(255,225,77,.3)}
.hc.over{outline:3px solid #fff;background:rgba(255,255,255,.5)}
.hpal{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:6px 10px;flex:none}
.hsrc{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.35);padding:8px 14px;box-shadow:0 0 0 3px #1e1e1e;touch-action:none;cursor:grab;font-weight:900;text-shadow:2px 2px 0 #000}
.hsrc .blk{width:56px;height:56px;box-shadow:0 0 0 2px #1e1e1e;animation:bob 1.6s ease-in-out infinite}
.hsrc b{font-size:22px}
.hsrc.empty{opacity:.35}
.hsrc.empty .blk{animation:none}
.hc.new{animation:pop .5s}
.hmsg{font-size:clamp(20px,calc(3 * var(--vw, 1vw)),32px);font-weight:900;text-shadow:2px 2px 0 #000;text-align:center;margin:10px 0}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.badges .bd{background:#c9932a;padding:4px 12px;font-weight:900;box-shadow:0 0 0 3px #1e1e1e}
.badges .bd.no{background:#555;opacity:.6}
.tw{position:absolute;width:6px;height:6px;background:#fff;animation:tw 2.4s infinite}
.moon{position:absolute;top:8%;right:10%;width:96px;height:96px}
.byeface{width:120px;height:120px;box-shadow:0 0 0 4px #1e1e1e;filter:brightness(.85)}

/* 家長 */
.parent{background:#ece6d9;color:#2b2b2b;overflow:auto;display:block;-webkit-overflow-scrolling:touch}
.ptop{position:sticky;top:0;background:#5d4a33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:2;font-weight:900;font-size:22px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
@media (max-width:800px){.pcards{grid-template-columns:1fr}}
.pcard{background:#fff;box-shadow:0 0 0 3px #3b2f22;padding:14px 16px}
.pcard h3{margin:0 0 6px;display:flex;align-items:center;gap:10px}
.pname{font:inherit;font-size:22px;font-weight:900;border:2px solid #cbbfa8;padding:4px 8px;width:60%}
.psec{margin-top:14px;padding:4px 8px;background:#5d4a33;color:#fff;font-weight:900}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #eee;gap:8px;flex-wrap:wrap}
.pbtn{font:inherit;font-weight:700;border:0;background:#8b6f4e;color:#fff;padding:7px 12px;box-shadow:0 0 0 2px #3b2f22;cursor:pointer;min-width:40px}
.pbtn.light{background:#ddd2bd;color:#2b2b2b}.pbtn.red{background:#b84a3a}
.pnote{font-size:14px;color:#7a6a55;padding:6px 2px}
.av{width:40px;height:40px;cursor:pointer;opacity:.45;box-shadow:0 0 0 2px #3b2f22}
.av.sel{opacity:1;box-shadow:0 0 0 3px #e8892b}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.aved{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.avbig{width:112px;height:112px;box-shadow:0 0 0 3px #3b2f22;background:#bfe3ff;flex:none}
.avopts{display:flex;flex-direction:column;gap:6px;flex:1;min-width:240px}
.avrow{display:flex;align-items:center;gap:10px}
.avrow>span:first-child{width:4.5em;flex:none;font-weight:700}
.sw{width:32px;height:32px;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 2px #3b2f22;opacity:.6}
.sw.sel{opacity:1;box-shadow:0 0 0 3px #e8892b;transform:scale(1.1)}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px;padding:6px 2px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:12px;height:100%}
.bar i{display:block;width:100%;background:#6aa84f;min-height:2px}
.ptable{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.ptable td,.ptable th{border-bottom:1px solid #eee;padding:4px;text-align:left}
.mist{font-size:15px;padding:4px 2px;border-bottom:1px dashed #ddd}
.gate{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10}
.gate.lockgate{position:fixed;inset:0;z-index:999;background:#2b3a55;font-weight:900}
.gbox{background:#ece6d9;color:#2b2b2b;padding:20px 26px;box-shadow:0 0 0 4px #3b2f22;text-align:center}
.dots{font-size:36px;letter-spacing:12px;margin:8px 0 12px;min-height:44px}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.keys .pbtn{font-size:26px;height:60px;padding:0}
.keys .pbtn.sm{font-size:17px}

/* 小汪 */
.dog{position:relative;width:var(--dw,96px);height:var(--dw,96px);flex:none;cursor:pointer;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
.dog img{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.dog .d0,.dog img.acc{opacity:1}
.dog.talk .d0{animation:mouthA .36s steps(1) infinite}
.dog.talk .d1{animation:mouthB .36s steps(1) infinite}
.dog.happy .d0{opacity:0}.dog.happy .d2{opacity:1}
.dog.happy{animation:bob .45s ease-in-out infinite}
.dog.sad{animation:tilt 1s ease-in-out 2}
@keyframes mouthA{0%{opacity:1}50%{opacity:0}}
@keyframes mouthB{0%{opacity:0}50%{opacity:1}}

/* 拖曳加法 */

function setupBuild() {

function buildState(c) {
  const used = { wood: 0, stone: 0, sand: 0, glass: 0 };
  let cur = BUILDS.length;
  BUILDS.forEach((b, i) => {
    const p = c.placed[i] || [];
    p.forEach(cell => used[b.mat[cell]]++);
    if (cur === BUILDS.length && p.length < b.cells.length) cur = i;
  });

  MATS.forEach(([m]) => have[m] = Math.max(0, c[m] - used[m]));

    const b = BUILDS[i], have = {};
    MATS.forEach(([m]) => have[m] = Math.max(0, (c[m] || 0) - used[m]));
    const done = MATS.every(([m]) => have[m] >= b.order[m].length);
    placed[i] = done ? b.cells.slice() : MATS.flatMap(([m]) => b.order[m].slice(0, Math.min(have[m], b.order[m].length)));

/* ---------- 手機／平板：手機上把畫面當成大一點的尺寸排版，再整個縮小到螢幕裡 ---------- */
// 沒選過就看螢幕大小自動判斷；家長可以在登入畫面切換，記在這台裝置
const DEV_NAME = { phone: '📱 手機', tablet: '💻 平板' };
const devMode = () => { let v; try { v = localStorage.getItem('bi-device'); } catch (e) {} return v || (Math.min(screen.width, screen.height) < 600 ? 'phone' : 'tablet'); };
const VP_MIN_W = 500, VP_MIN_H = 560; // 手機直向至少當成 500 寬、橫向至少 560 高來排
// 量出真的看得到的範圍，把整個 #app 用比較大的尺寸排版，再用 transform 等比例縮小
// （iPhone 加到主畫面時不理會改 viewport，所以自己縮）
let zoomK = 1;
function fitViewport() {
  const st = app.style, phone = devMode() === 'phone';
  document.documentElement.classList.toggle('phone', phone);
  st.width = st.height = st.transform = st.right = st.bottom = '';
  zoomK = 1;
  let vw = 0, vh = 0;
  if (phone) {
    const r = app.getBoundingClientRect(), W = r.width, H = r.height, land = W > H;
    const k = Math.min(1, W / VP_MIN_W, land ? H / VP_MIN_H : 1);
    if (k < 1) zoomK = k, vw = W / k, vh = H / k;
  }
  // 版面裡的 vw/vh 都寫成 calc(N * var(--vw, 1vw))，縮放時改成放大後的尺寸，比例才會跟平板一樣
  const rs = document.documentElement.style;
  rs.setProperty('--zk', zoomK);
  if (zoomK < 1) {
    Object.assign(st, { width: vw + 'px', height: vh + 'px', right: 'auto', bottom: 'auto', transform: `scale(${zoomK})` });
    rs.setProperty('--vw', vw / 100 + 'px'); rs.setProperty('--vh', vh / 100 + 'px');
  } else { rs.removeProperty('--vw'); rs.removeProperty('--vh'); }
  // 畫面大小變了，房子和家園的格子也要重算
  if (S.screen === 'garden' && S.gLv != null) fitGarden();
  if (S.screen === 'house') fitHouse();
}

const fetchFresh = () => fetch('index.html?fresh=' + Date.now(), { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.text(); });
const verLine = () => verErr ? `版本 ${APP_VER}　⚠ 沒有網路，無法確認是不是最新版`
  : !latestVer ? `版本 ${APP_VER}　檢查中…`
  : latestVer === APP_VER ? `版本 ${APP_VER}　✅ 已經是最新版`
  : `<span>版本 ${APP_VER}　⚠ 有新版本 ${latestVer}</span><button class="btn small orange" data-act="appupdate">🔄 更新</button>`;
// 直接向網路拿 index.html，讀出裡面的 APP_VER（一分鐘內只問一次）
async function checkVersion() {
  if (Date.now() - verAt < 60e3) return;
  verAt = Date.now();
  try {
    const t = await fetchFresh(), m = t.match(/const APP_VER = '([^']+)'/);
    latestVer = m ? m[1] : APP_VER; verErr = false;
    latestHTML = latestVer === APP_VER ? null : t; // 有新版就留著，按更新時不用再下載一次
  } catch (e) { verErr = true; verAt = 0; }
  const el = document.getElementById('appver'); if (el) el.innerHTML = verLine();
}
// 把新版存進離線快取再重新開啟
async function appUpdate() {
  const el = document.getElementById('appver'); if (el) el.textContent = '更新中，請稍等…';
  try {
    const body = latestHTML || await fetchFresh();
    for (const k of await caches.keys()) {
      if (!k.startsWith('block-island-')) continue;
      const c = await caches.open(k);
      for (const u of ['./', './index.html']) await c.put(u, new Response(body, { headers: { 'Content-Type': 'text/html; charset=utf-8' } }));
    }
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
  } catch (e) { if (el) el.textContent = '更新失敗，請確認有網路後再試一次'; verAt = 0; return; }
  location.reload();
}

// 數學、注音、英文共用同一套出題流程：每關 5 題，題目由 SUBJ[subject].gen 產生
function startGame(subject = 'math', lead = '') {
  S.again = () => startGame(subject); S.lastBiome = subject;
  S.game = { subject, idx: 0, total: 5, correctFirst: 0, starsEarned: 0, fs: 0, ff: 0, levelUp: false };
  nextQ(lead);
}
const qParts = q => q.parts || [{ text: q.say }];
function nextQ(lead) {
  const g = S.game, p = P(S.child, g.subject);
  if (S.endPending && g.idx < g.total) return goodbye();
  if (g.idx >= g.total) return g.review ? finishReview() : finishRound();
  // 英文每關最後一題是口說題（裝置不支援語音辨識時就照常出點選題）
  if (g.review) { const w = g.review[g.idx]; g.subject = w.s; g.q = reviewQ(w); }
  else {
    // 同一輪裡不出一樣的題目（最多重抽 30 次）
    const seen = g.seen = g.seen || new Set(), gen = () => g.subject === 'eng' && g.idx === g.total - 1 && speakOK() ? genSpeak(p.level) : SUBJ[g.subject].gen(p.level);
    const key = q => (q.rec || q.display) + '|' + q.answer;
    for (let k = 0; k < 30; k++) { g.q = gen(); if (!seen.has(key(g.q))) break; }
    seen.add(key(g.q));
    g.q.L = p.level;
  }
  g.attempts = 0; g.wrong = []; g.hintShown = false; g.state = 'asking'; g.listening = false;
  g.talking = true; g.building = !!g.q.build;
  renderGame();
  if (g.q.build) setupBuild();
  // 小汪先把題目講完，選項才能按，避免孩子還沒聽完就亂點
  const unlock = () => { if (S.game === g && g.talking) { g.talking = false; refreshLock(); } };
  dogSay([...(lead ? [{ text: lead }] : []), ...qParts(g.q)], unlock);
  later(unlock, 12000);
}
function refreshLock() {
  const g = S.game, a = document.querySelector('.answers');
  if (g && a) a.classList.toggle('wait', !!(g.talking || g.building));
}

function logQ(ok) {
  const c = S.child, g = S.game, q = g.q;
  c.log.push({ t: Date.now(), s: g.subject, L: q.L, q: q.rec || q.display, ans: q.answer, ok, picks: g.wrong.slice() });
  if (c.log.length > 500) c.log.shift();

function adapt(kind) {
  const g = S.game, p = P(S.child, g.subject);
  if (g.review) return;
  if (kind === 'first') { g.fs++; g.ff = 0; } else if (kind === 'ok') { g.fs = 0; g.ff = 0; } else { g.ff++; g.fs = 0; }
  // 數學 Lv5 以上不自動升級，等家長確認孩子真的懂了再到後台手動升
  if (g.fs >= 3 && p.level < p.maxLevel && !(g.subject === 'math' && p.level >= MATH_MANUAL_FROM)) {
    p.level++; g.fs = 0; g.levelUp = true;
    setTimeout(() => { bubble('題目升級了！⬆'); speak('你變厲害了，題目升級囉！', { queue: true }); }, 800);
  }
  // 降級時不特別告訴孩子，避免挫折感
  if (g.ff >= 2 && p.level > p.minLevel) { p.level--; g.ff = 0; }
}
function onAnswer(i, el) {
  const g = S.game;
  if (!g || g.state !== 'asking' || g.talking || g.building) return;
  judge(g.q.options[i] === g.q.answer, el, g.q.options[i]);

// 點選題和口說題共用：答對、第 1 次錯再試、第 2 次錯給提示、第 3 次錯公布答案
// 英文關卡用英文稱讚和鼓勵（家長指定的句子，畫面上附中文）
const EN_PRAISE = [['Correct!', '正確！'], ["That's right!", '沒錯！'], ['You got it!', '你答對了！']];
const EN_TRY = [['Good try!', '很棒的嘗試！'], ['Nice effort!', '很努力喔！'], ['Thank you for trying!', '謝謝你願意試試看！'], ['I love that you tried!', '我好喜歡你勇於嘗試！'], ['Almost! Think about it and try again.', '差一點點！想一下再試一次。']];
function judge(ok, el, v) {
  const g = S.game, c = S.child, q = g.q, en = g.subject === 'eng';
  g.attempts++;
  if (ok) {
    g.state = 'done'; SFX.ok(); el.classList.add('good');
    const first = g.attempts === 1;
    c.totalCorrect++;
    if (first) { c.stars++; U(c).stars++; g.starsEarned++; g.correctFirst++; }
    const praise = first ? pick(['答對了！', '好厲害！', '太棒了！', '完全正確！']) : pick(['答對了！你沒有放棄，好棒！', '對了！越來越厲害！']);
    if (en) { const [e, zh] = pick(EN_PRAISE); bubble(`${e}${first ? ' +1 ⭐' : ''}\n（${zh}）`, 2000); speak(e, { en: true }); }
    else { bubble(first ? praise + ' +1 ⭐' : praise); speak(praise); }
    setDog('happy');
    logQ(first); adapt(first ? 'first' : 'ok');
    const go = () => hiFive(() => { g.idx++; nextQ(); });
    later(() => en && q.learn && !q.speak ? learnCard(q.learn, go) : go(), en && q.learn ? 1300 : 900);
  } else {
    SFX.no(); g.wrong.push(v);
    if (g.attempts === 1) recordWrong(g);
    if (!q.speak) el.classList.add('off');
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    if (en && g.attempts < 3) {
      const [e, zh] = pick(g.attempts === 1 ? EN_TRY : EN_TRY.slice(0, 4));
      if (g.attempts === 2) showHint();
      bubble(`${e}${g.attempts === 2 ? ' 💡' : ''}\n（${zh}）`, 2400);
      dogSay([{ text: e, en: true }, ...(g.attempts === 2 ? q.hintParts || [] : [])], null, 'sad');
    }
    else if (g.attempts === 1) { bubble(q.speak ? '再說一次看看！' : '再想想看喔！'); dogSay([{ text: q.speak ? '沒關係，再說一次看看！' : '沒關係，小汪陪你再想想看！' }], null, 'sad'); }
    else if (g.attempts === 2) { showHint(); bubble('一起看提示 💡'); dogSay([{ text: '別擔心，我們一起看提示！' }, ...(q.hintParts || [])], null, 'sad'); }
    else {
      g.state = 'done';
      document.querySelectorAll('.ans').forEach(b => { if (q.options[+b.dataset.v] === q.answer) { b.classList.remove('off'); b.classList.add('reveal'); } });
      bubble(q.speak ? '很棒的嘗試！👍' : `答案是 ${q.ansLabel || q.answer}`, 2400);
      dogSay(q.revealParts || (en ? [{ text: 'The answer is', en: true }, ...(q.ansParts || [{ text: String(q.answer), en: true }]), { text: 'Nice effort!', en: true }]
        : [{ text: '答案是' }, ...(q.ansParts || [{ text: String(q.answer) }]), { text: '，下次一定可以！' }]));
      logQ(false); adapt('fail');
      later(() => { g.idx++; nextQ(); }, 2800);
    }
  }
  updateHud(); save();
}
/* ---------- 每週回顧：這一週答錯過的題目再做一次，每週一次 ---------- */
const REVIEW_MAX = 5, REVIEW_GIFT = { stars: 4, gold: 3, bombs: 2 };
// 這一週的代號：星期一的日期
const weekKey = () => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return fmt(d); };
// 第一次答錯就記下來（拖曳題、口說題不記）；題目本身存起來，回顧時原樣再出
function recordWrong(g) {
  const c = S.child, q = g.q;
  if (g.review || q.build || q.speak) return;
  const key = g.subject + '|' + (q.rec || q.display) + '|' + q.answer;
  c.wrongQ = c.wrongQ.filter(w => w.k !== key);
  c.wrongQ.push({ t: Date.now(), k: key, s: g.subject, q: JSON.parse(JSON.stringify(q)) });
  if (c.wrongQ.length > 60) c.wrongQ.shift();
}
const reviewList = c => c.wrongQ.filter(w => Date.now() - w.t < 7 * 864e5).slice(-REVIEW_MAX);
// 家長指定：每週日下午 5 點以後才開放，其他時間按鈕是灰色的
const reviewTime = () => { const d = new Date(); return d.getDay() === 0 && d.getHours() >= 17; };
const reviewReady = c => reviewTime() && c.reviewWeek !== weekKey() && reviewList(c).length > 0;
function startReview() {
  const c = S.child, list = reviewList(c);
  if (!reviewReady(c)) { speak(c.reviewWeek === weekKey() ? '這個星期的回顧已經做完了，下個星期再來喔！' : '這個星期沒有答錯的題目，好厲害！'); return; }
  S.again = null;
  S.game = { subject: list[0].s, review: list, idx: 0, total: list.length, correctFirst: 0, starsEarned: 0, fs: 0, ff: 0, levelUp: false };
  nextQ('每週回顧！這些是這個星期答錯過的題目，再挑戰一次！');
}
// 存起來的題目沒有函式，選項的圖案要補回來

// placed 為空代表整座都已蓋好（小島上的縮圖）；否則沒放的格子顯示成虛線，裡面淡淡顯示要放的材料
function planHTML(plan, placed) {
  let cells = '';
  plan.forEach((row, r) => [...row].forEach((ch, col) => {
    const i = r * 12 + col;
    if (ch === '.') cells += '<i class="hc"></i>';
    else if (ch === 'g' || !placed || placed.has(i)) cells += `<i class="blk hc t-${HTEX[ch]} ${i === S.lastCell ? 'new' : ''}"></i>`;
    else cells += `<i class="hc need" data-cell="${i}" data-m="${HMAT[ch]}"><i class="blk gt t-${HTEX[ch]}"></i></i>`;
  }));
  return `<div class="house ${placed ? '' : 'mini'}">${cells}</div>`;
}
function renderHouse(opt = {}) {
  S.screen = 'house';
  const c = S.child, st = buildState(c), all = st.cur >= BUILDS.length;
  const town = st.cur ? `<div class="town ${all ? 'big' : ''}">${BUILDS.slice(0, st.cur).map(b =>
    `<div class="tb">${planHTML(b.plan)}<div class="tname"><span class="pet">${b.pet[0]}</span> ${zy(b.name)}</div></div>`).join('')}</div>` : '';
  const cheer = opt.built ? `${opt.built.name}蓋好了！${opt.built.pet[1]}搬進來囉！` : '';
  let body, msg, say, pal = '';
  if (all) {
    body = town; msg = '五座建築全部蓋好了！你的小島好熱鬧！🎉';
    say = cheer + '你把整座小島都蓋好了，太厲害了！';
  } else {
    const b = BUILDS[st.cur], placed = new Set(c.placed[st.cur] || []);
    const left = m => b.order[m].filter(cell => !placed.has(cell)).length;
    const short = MATS.filter(([m]) => left(m) > st.have[m]).map(([m, name, place]) => `${place}可以拿${name}`);
    pal = `<div class="hpal">${MATS.filter(([m]) => left(m) > 0).map(([m, name, , t]) =>
      `<div class="hsrc ${st.have[m] ? '' : 'empty'}" data-m="${m}"><i class="blk t-${t}"></i><b>${st.have[m]}</b><span>${zy(name)}</span></div>`).join('')}</div>`;
    body = `<div class="hrow">${town}${planHTML(b.plan, placed)}${pal}</div>`; pal = '';
    msg = `正在蓋：${b.name}　把材料拖到虛線格子裡！`;
    say = cheer + (canPlace(c) ? `這是你的${b.name}！把下面的材料拖到虛線格子裡，自己蓋蓋看！` : `${b.name}還需要材料喔！${short.join('，')}。`) + `蓋好會有${b.pet[1]}搬進來喔！`;
  }
  mount(`<div class="screen sky">${hud('tomap')}
    ${cheer ? `<div class="badge hcheer">🎉 ${zy(cheer)}</div>` : ''}<div class="hmsg">${zy(msg)}</div>${body}${pal}
    <div class="mapbar"><button class="btn green big" data-act="tomap">▶ ${zy('去冒險拿材料')}</button><button class="btn orange big" data-act="garden">${questComplete(c) ? '🌳' : '🔒'} ${zy('家園模式')}</button></div>${petBuddy()}</div>`);
  if (opt.built) SFX.win();
  if (!opt.quiet || opt.built) speak(say);
  if (!all) { fitHouse(); setupHouseDrag(); }
}
// 依剩下的空間縮放正在蓋的房子，避免跟材料疊在一起（直向、橫向都適用）
function fitHouse() {
  const row = document.querySelector('.hrow'), h = row && row.querySelector(':scope > .house');
  if (!h) return;
  h.style.removeProperty('--hb');
  const pal = row.querySelector('.hpal'), town = row.querySelector('.town'), land = innerWidth > innerHeight;
  const rows = Math.ceil(h.children.length / 12), gap = 28;
  const H = row.clientHeight - (land ? 0 : pal.offsetHeight + 12) - 8;
  const W = row.clientWidth - (land ? pal.offsetWidth + gap : 0) - (town ? town.offsetWidth + gap : 0) - 8;
  const now = h.offsetWidth / 12, fit = Math.floor(Math.min(now, H / rows, W / 12));
  if (fit < now) h.style.setProperty('--hb', fit + 'px');
}
// 拖曳手上的材料到虛線格子；要放的格子會亮黃框
function setupHouseDrag() {
  const c = S.child;
  let ghost = null, m = '';
  // 放得不準也沒關係：手指附近（大約一格半內）有要放這種材料的空格，就吸過去
  const slotAt = (x, y) => {
    let best = null, bd = Infinity;
    document.querySelectorAll(`.hc.need[data-m="${m}"]`).forEach(s => {
      const r = s.getBoundingClientRect(), d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
      if (d < r.width * 1.6 && d < bd) { bd = d; best = s; }
    });
    if (best) return best;
    const el = document.elementFromPoint(x, y); return el && el.closest('.hc.need');
  };
  const move = e => {
    if (!ghost) return;
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const s = slotAt(e.clientX, e.clientY);
    document.querySelectorAll('.hc.need').forEach(x => x.classList.toggle('over', x === s));
  };
  const up = e => {
    if (!ghost) return;
    ghost.remove(); ghost = null;
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    document.querySelectorAll('.hc.need').forEach(x => x.classList.remove('want', 'over'));
    const s = slotAt(e.clientX, e.clientY);
    if (s && S.screen === 'house') placeBlock(s, m);
  };
  document.querySelectorAll('.hsrc').forEach(src => src.addEventListener('pointerdown', e => {
    const mm = src.dataset.m, mat = MATS.find(x => x[0] === mm);
    if (!buildState(c).have[mm]) { speak(`${mat[1]}用完了，去${mat[2]}收集吧！`); return; }
    e.preventDefault(); m = mm;
    ghost = document.createElement('div');
    ghost.className = 'ghost blk t-' + mat[3];
    ghost.style.setProperty('--gb', '56px');
    document.body.appendChild(ghost); move(e);
    document.querySelectorAll(`.hc.need[data-m="${mm}"]`).forEach(x => x.classList.add('want'));
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }));
}
function placeBlock(slot, m) {
  const c = S.child, bi = buildState(c).cur;
  if (slot.dataset.m !== m) { SFX.no(); speak(`這一格要放${MATS.find(x => x[0] === slot.dataset.m)[1]}喔！`); return; }
  (c.placed[bi] = c.placed[bi] || []).push(+slot.dataset.cell);
  S.lastCell = +slot.dataset.cell; save(); SFX.tap();
  const built = buildState(c).cur > bi ? BUILDS[bi] : null;
  renderHouse({ quiet: true, built });
}

const FACES = ['t-grass', 't-planks', 't-sand', 't-gold', 't-deep', 't-log', 't-snow', 's-star', 's-sun', 's-moon', 's-heart', 's-pig', 's-mon'];
const faceHTML = f => f[0] === 't' ? `<i class="blk ${f}"></i>` : `<img class="px" src="${SPR[f.slice(2)]}">`;
function startMemory() {
  const L = flv('memory'), pairs = [3, 4, 6, 8, 10][L - 1], cols = [3, 4, 4, 4, 5][L - 1], rows = pairs * 2 / cols;
  const faces = shuffle(FACES.slice()).slice(0, pairs);
  const cards = shuffle([...faces, ...faces]).map(f => ({ f, open: false, done: false }));
  S.fg = { game: 'memory', L, pairs, cards, first: null, lock: false, moves: 0, matched: 0, miss: 0, freePeek: false };
  const cw = `min(calc((calc(100 * var(--vw, 1vw)) - 80px) / ${cols} - 12px), calc((calc(100 * var(--vh, 1vh)) - 200px) / ${rows} - 12px), 150px)`;
  focusShell('找出一樣的兩張！', true, `<div class="mgrid" style="grid-template-columns:repeat(${cols},var(--cw));--cw:${cw}">${cards.map((c, i) =>
    `<button class="card" data-act="mcard" data-v="${i}"><span class="back blk t-dirt">?</span><span class="front">${faceHTML(c.f)}</span></button>`).join('')}</div>`);
  speak(FGAMES.memory.say);
  // 低等級開場先讓孩子看 3 秒再蓋起來
  if (L <= 2) peek(3000);
}
function peek(ms) {
  const g = S.fg; g.lock = true;
  document.querySelectorAll('.card').forEach(e => e.classList.add('open'));
  later(() => {
    document.querySelectorAll('.card').forEach((e, i) => e.classList.toggle('open', g.cards[i].open || g.cards[i].done));
    g.lock = false;
  }, ms);
}
function memTap(i) {
  const g = S.fg, c = g && g.cards && g.cards[i];
  if (!c || g.lock || c.open || c.done) return;
  const el = document.querySelectorAll('.card');
  c.open = true; el[i].classList.add('open', 'flip'); SFX.tap();
  if (g.first === null) { g.first = i; return; }
  const j = g.first, a = g.cards[j];
  g.first = null; g.moves++;
  if (a.f === c.f) {
    a.done = c.done = true; g.matched++; g.miss = 0;
    el[i].classList.add('done'); el[j].classList.add('done'); SFX.ok();
    bubble(pick(['一樣的！', '找到了！', '好眼力！']), 900);
    if (g.matched === g.pairs) later(() => {
      const r = g.moves / g.pairs;
      endFocus(r <= 1.5 ? 3 : r <= 2.5 ? 2 : 1, r <= 2, r > 3.5, `${g.pairs} 對，翻了 ${g.moves} 次`);
    }, 1000);
  } else {
    g.lock = true; g.miss++;
    later(() => {
      a.open = c.open = false;
      el[i].classList.remove('open', 'flip'); el[j].classList.remove('open', 'flip');
      g.lock = false;
      if (g.miss >= 4 && !g.freePeek) { g.freePeek = true; g.miss = 0; bubble('偷看一下 👀'); speak('沒關係，我們偷看一下！'); peek(1500); }
    }, 1000);
  }
}

/* ---------- 金礦山：用炸彈炸開石頭挖金礦；藏著金礦的石頭偶爾會閃一下，讓孩子觀察要炸哪裡 ---------- */
// 炸彈只從每日任務寶箱拿（第一次來送一次），金礦拿去商店買寵物和人物裝飾
const MINE_W = 7, MINE_H = 6, MINE_BOMBS = 3;
function newMine() {
  const n = MINE_W * MINE_H, ore = Array(n).fill(0);
  shuffle([...Array(n).keys()]).slice(0, 8).forEach((i, k) => ore[i] = k ? 3 : 10); // 7 個金礦（3 個），1 個大金塊（10 個）

function renderMine(line) {

  if (!c.mineIntro) { c.mineIntro = true; c.bombs += MINE_BOMBS; save(); }
  const m = c.mine;
  mount(`<div class="screen cave">${hud('tomap')}
    <div class="minetop"><span class="pill big">${ICO.bomb()} <b id="mBombs">${c.bombs}</b></span><span class="pill big">${ICO.gold()} <b id="mGold">${c.gold}</b></span></div>
    <div class="hmsg" id="mmsg">${zy(line || (c.bombs ? '看看哪裡在閃光，點一下放炸彈！' : '炸彈用完了，完成今日任務就有新炸彈喔！'))}</div>
    <div class="minegrid" id="minegrid" style="grid-template-columns:repeat(${MINE_W},var(--mc))">${m.ore.map((o, i) =>
      `<button class="mc ${m.broken[i] ? (o ? 'ore got' : 'empty') : 'blk t-stone'} ${!m.broken[i] && o ? 'glint' : ''}" data-act="mbomb" data-v="${i}" style="animation-delay:${(i * 0.37) % 2}s">${m.broken[i] && o ? `<img class="px nug ${o >= 10 ? 'big' : ''}" src="${SPR.gold}">` : ''}</button>`).join('')}</div>
    <div id="bubble" class="bubble"></div></div>`);
}
function mineBomb(i) {
  const c = S.child, m = c.mine;
  if (S.mineBusy || !m || m.broken[i]) return;
  if (c.bombs <= 0) { SFX.no(); speak('炸彈用完了，完成今日任務就有新炸彈喔！'); return; }
  S.mineBusy = true; c.bombs--; save();

  const cells = document.querySelectorAll('.mc'), el = cells[i];
  el.innerHTML = `<img class="px bomb" src="${SPR.bomb}">`; beep([200, 180, 160, 140], .15, 'square', .05);
  later(() => {
    // 爆炸：3×3 格
    beep([90, 70, 50], .18, 'sawtooth', .12);
    document.getElementById('minegrid').classList.add('boom');
    const x = i % MINE_W, y = (i / MINE_W) | 0;
    let got = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = x + dx, ny = y + dy, j = ny * MINE_W + nx;
      if (nx < 0 || nx >= MINE_W || ny < 0 || ny >= MINE_H || m.broken[j]) continue;
      m.broken[j] = 1; got += m.ore[j];
      const cel = cells[j]; cel.className = 'mc ' + (m.ore[j] ? 'ore' : 'empty') + ' blast'; cel.innerHTML = m.ore[j] ? `<img class="px nug ${m.ore[j] >= 10 ? 'big' : ''}" src="${SPR.gold}">` : '';
    }
    c.gold += got; c.goldN = (c.goldN || 0) + got; save(); if (got) checkBadges();
    later(() => {
      document.getElementById('minegrid').classList.remove('boom');
      
      document.getElementById('mGold').textContent = c.gold;

      const left = m.ore.some((o, j) => o && !m.broken[j]);
      if (got) { SFX.win(); bubble(`+${got}`, 1500); document.getElementById('bubble').insertAdjacentHTML('afterbegin', ICO.gold()); speak(got >= 10 ? `哇！挖到大金塊，${got} 個金礦！` : `挖到 ${got} 個金礦！`); }

      if (!left) later(() => { c.mine = newMine(); save(); renderMine('金礦都挖完了！又出現一座新的礦山！'); speak('金礦都挖完了！又出現一座新的礦山！'); }, 2200);
    }, 700);
  }, 1000);
}

/* 翻牌對戰：兩台 iPad 用同一個家庭代碼，輪流翻同一副牌 */
// 房間存在 Firestore 的 families/{家庭代碼}/rooms/memory；只有輪到的人會寫入，另一台每秒讀一次
const roomURL = code => docURL(code) + '/rooms/memory';
async function roomGet() {

}
async function roomPut(room) {

  const r = await fetch(roomURL(S.data.cloud.code), { method: 'PATCH', headers: { Authorization: 'Bearer ' + await fbToken(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

const DUEL_MODES = { race: ['競賽', '看誰找到的比較多！'], coop: ['合作', '兩個人一起把牌全部找完！'] };

async function duelTap(i) {

/* 依序點擊 */
const TONES = [262, 294, 330, 349, 392, 440, 494, 523, 587];
const SEQTEX = ['grass', 'sand', 'deep', 'planks', 'gold', 'log', 'snow', 'glass', 'cobble'];
function startSeq() {
  const L = flv('seq'), size = L <= 2 ? 2 : 3;
  S.fg = { game: 'seq', L, size, len: L + 1, round: 0, rounds: 3, firstOK: 0, fails: 0, input: false };
  const tw = `min(calc((calc(100 * var(--vh, 1vh)) - 230px) / ${size} - 14px), 170px)`;
  focusShell('仔細看…', true, `<div class="sgrid" style="grid-template-columns:repeat(${size},var(--tw));--tw:${tw}">${SEQTEX.slice(0, size * size).map((t, i) =>
    `<button class="tile blk t-${t}" data-act="tile" data-v="${i}"></button>`).join('')}</div>`);
  speak(FGAMES.seq.say);
  later(newSeq, 4500);
}
function newSeq() {
  const g = S.fg, n = g.size * g.size, len = g.len + (g.round === 2 ? 1 : 0);
  g.seq = [];
  while (g.seq.length < len) { const v = ri(0, n - 1); if (v !== g.seq[g.seq.length - 1]) g.seq.push(v); }
  g.tries = 0; g.guide = false;
  playSeq();
}
function flash(i, ms) {
  const el = document.querySelectorAll('.tile')[i]; if (!el) return;
  el.classList.add('lit'); beep([TONES[i]], ms / 1000 * .8, 'triangle', .12);
  later(() => el.classList.remove('lit'), ms);
}
const setGuide = i => document.querySelectorAll('.tile').forEach((e, k) => e.classList.toggle('guide', k === i));
function playSeq() {
  const g = S.fg, gap = (g.L <= 2 ? 1000 : 800) * (g.guide ? 1.3 : 1);
  g.input = false; setCap('仔細看…'); setGuide(-1);
  g.seq.forEach((v, k) => later(() => flash(v, gap * .6), 600 + k * gap));
  later(() => { g.input = true; g.pos = 0; setCap('換你了！'); speak('換你了！'); if (g.guide) setGuide(g.seq[0]); }, 600 + g.seq.length * gap);
}
function seqTap(i) {
  const g = S.fg; if (!g || !g.input) return;
  flash(i, 250);
  if (i === g.seq[g.pos]) {
    g.pos++;
    if (g.guide) setGuide(g.pos < g.seq.length ? g.seq[g.pos] : -1);
    if (g.pos < g.seq.length) return;
    g.input = false;
    if (g.tries === 0) g.firstOK++;
    later(() => { SFX.ok(); bubble(pick(['記得好清楚！', '完全正確！', '好厲害！']), 1000); }, 300);
    nextSeqRound(1600);
  } else {
    g.input = false; g.tries++; SFX.no(); setGuide(-1);
    if (g.tries === 1) { bubble('再看一次喔！'); speak('再看一次喔！'); later(playSeq, 1500); }
    else if (g.tries === 2) { g.guide = true; bubble('跟著發亮的方塊點 💡'); speak('沒關係，跟著發亮的方塊點！'); later(playSeq, 2000); }
    else { g.fails++; bubble('沒關係，下一題！'); speak('沒關係，我們換下一題！'); nextSeqRound(1800); }
  }
}
function nextSeqRound(ms) {
  const g = S.fg; g.round++;
  if (g.round >= g.rounds) later(() => endFocus(Math.max(1, g.firstOK), g.firstOK === 3, g.fails >= 2, `${g.len} 個方塊，一次記住 ${g.firstOK}/3`), ms);
  else later(newSeq, ms);
}

/* 礦洞迷宮 */
function genMaze(n) {
  const W = 2 * n + 1, m = Array(W * W).fill(1), st = [[0, 0]], seen = new Set(['0,0']);
  m[W + 1] = 0;
  while (st.length) {

  }
}, 1000);
// 離開時：存檔、記下時間；回來時：離開太久就要家長解鎖（語音也要重新啟動）
document.addEventListener('visibilitychange', () => {
  saveLocal();
  if (document.hidden) { S.hiddenAt = Date.now(); voiceReady = false; }
  else if (S.hiddenAt && Date.now() - S.hiddenAt > LOCK_AWAY && !S.gateUnlock) appLock();
});

S.data = load();
pickVoice();
initArt();
fitViewport();
renderLogin();
appLock();
loadRecs();
loadSiteRecs(); loadVoicePack();
scheduleCloud(2000);

// 放到網址上才會啟用離線快取；直接開檔案時略過
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
// 請瀏覽器不要自動清掉孩子的進度
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
